  if(e.webkitCompassHeading<0||(acc!=null&&acc<0)){BADEV++;if(BADEV===45)HEADACC=-1;if(BADEV===45||BADEV===61)hdUI();return}   // 아이폰: 나침반 준비 전·무효일 땐 0°·정확도 -1 이 옴 → 버림(북쪽으로 오해 방지)
  h=e.webkitCompassHeading+DECL}
