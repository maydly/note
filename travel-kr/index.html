    260919 명진 확정 — 이 주소는 통합 여행지도로 넘긴다.

    왜: 여기는 국내만 담던 옛 지도다. 260912에 국내·일본을 한 지도로 합치면서

    옛 북마크·공유 링크가 있을 수 있어 지우지 않고 넘겨보낸다.

    원본 페이지는 git 이력에 있다(직전 커밋). 되돌리려면 그걸 꺼내면 된다.
    common.js·common.css·data/ 는 건드리지 않고 그대로 뒀다.

  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
