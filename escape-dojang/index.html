  return '<div class="rv">'+h+(meta.length?'<div class="src">'+esc(meta.join(' · '))+'</div>':'')+'<div class="btns"><a class="alt" href="'+esc(it.blog)+'" target="_blank" rel="noopener">네이버 블로그 후기</a>'+(it.ez?'<a class="alt" href="'+esc(it.ez)+'" target="_blank" rel="noopener">EZCAPE 평가·후기</a>':'')+'</div></div>';}
function detail(it){var h='<h4>어떤 방탈출인가요</h4>'+(it.story?'<div class="story">'+esc(it.story)+'</div>':'<div class="story muted">매장 공식 소개에 줄거리 글이 없어요(장르·인원 같은 정보만 있어요).</div>');
  if(it.ssrc||it.extra)h+='<div class="src">'+(it.extra?esc(it.extra)+' · ':'')+(it.ssrc?'출처: '+(/^https?:/.test(it.ssrc)?'<a href="'+esc(it.ssrc)+'" target="_blank" rel="noopener">'+esc(srcLabel(it.ssrc))+'</a>':esc(it.ssrc)):'')+'</div>';
  var rows=[['장르',it.genre||'—'],['장치·자물쇠',it.mix?it.mix+' ('+it.mixsrc+')'+(it.mixfull&&it.mixfull!==it.mix?' — '+it.mixfull:''):'자료 없음'],['콘텐츠',it.focus||'자료 없음'],['공포도',it.fear||'자료 없음'],['활동량',it.act||'자료 없음'],['플레이',it.time+'분'+(it.people?' · '+it.people+(/[명인]/.test(it.people)?'':'명'):'')],['난이도',it.diff?it.diff+'/10':'—']];
  h+='<h4>정보</h4><dl>'+rows.map(function(r){return '<dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd>';}).join('')+'</dl>';
  h+='<h4>다른 사람 리뷰</h4>'+reviewSum(it);
  if(it.url)h+='<div class="btns"><a href="'+esc(it.url)+'" target="_blank" rel="noopener">예약 페이지</a></div>';
  return h;}
function row(it,nextIt){
  var st=it.done?'<div class="stamp"><b>깼다!</b><span>'+esc(it.done)+'</span></div>':(it.retry?'<div class="stamp re"><b>재도전</b><span>'+esc(it.retry)+'</span></div>':'');
  var nx=(it===nextIt)?'<span class="next">다음 차례</span>':'';
  var meta=[esc(it.gu),it.time+'분',esc(it.genre)].filter(Boolean).join(' · ');
  var rt=it.rating?'<span class="rt">평점 '+it.rating.toFixed(2)+'</span>':'<span class="muted">평점 없음</span>';
  var df=it.diff?' · 난이도 '+it.diff+'/10<i class="db"><i style="width:'+(it.diff*10)+'%"></i></i>':'';
  return '<li class="it'+(it.done?' done':'')+(it.retry?' retry':'')+'" id="t'+it.rank+'"><div class="hd" onclick="this.parentNode.classList.toggle(\'open\')"><div class="ph"><span class="rk">'+it.rank+'</span>'+poster(it)+'</div><div class="tx"><div class="nm">'+esc(it.name)+' '+nx+'</div><div class="vn">'+esc(it.venue)+'</div><div class="mt">'+meta+'</div><div class="mt">'+rt+df+'</div>'+(it.story?'<div class="sn">'+esc(it.story)+'</div>':'')+'<div class="chips">'+chips(it)+'</div></div></div>'+st+'<div class="det">'+detail(it)+'</div></li>';}
function listHtml(L,withYr){var nextIt=null;for(var i=0;i<L.length;i++){if(!L[i].done&&!L[i].retry){nextIt=L[i];break;}}
  var h='',left=0;for(var j=0;j<L.length;j++){var it=L[j];h+=row(it,nextIt);if(withYr&&!it.done){left++;if(left===12)h+='<li class="yr">— 월 1회면 여기까지가 1년 치(12개) —</li>';if(left===26)h+='<li class="yr">— 2주에 1회면 여기까지가 1년 치(26개) —</li>';}}
  return '<ol class="lst">'+h+'</ol>';}
function renderList(){var L=D.filter(function(x){return (!thrOnly||x.thr)&&(!leftOnly||!x.done);});
  var cmp={rec:function(a,b){return a.rank-b.rank;},easy:function(a,b){return ((a.diff||11)-(b.diff||11))||((b.rating||0)-(a.rating||0));}}[view];L.sort(cmp);
  document.getElementById('list').innerHTML=L.length?listHtml(L,true):'<p class="muted">조건에 맞는 테마가 없어요.</p>';document.getElementById('cnt').textContent=L.length;}
function guStyle(name){var n=DD.gu[name]||0;if(!n)return {color:'#9a9a9a',weight:1,dashArray:'4 3',fillColor:'#fff',fillOpacity:.1};
  var sel=(selGu===name);return {color:sel?'#1d2b3a':'#6b7c8f',weight:sel?3:1.5,fillColor:'#8aa0b8',fillOpacity:Math.min(.16,.04+n/300)+(sel?.1:0)};}
function initMap(){if(MAP||!window.L)return;MAP=L.map('lmap',{zoomControl:true,attributionControl:true,zoomSnap:.25});
  var esri=function(){L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'지도 &copy; Esri'}).addTo(MAP);};
  var hasGL=(function(){try{var c=document.createElement('canvas');return !!(c.getContext('webgl2')||c.getContext('webgl'));}catch(e){return false;}})();
  if(hasGL&&window.maplibregl&&L.maplibreGL&&window.fetch){
    fetch('https://tiles.openfreemap.org/styles/positron').then(function(r){if(!r.ok)throw new Error('style');return r.json();}).then(function(st){
      (st.layers||[]).forEach(function(l){if(l.type==='symbol'&&l.layout&&l.layout['text-field']&&l.id.indexOf('shield')<0){l.layout['text-field']=['coalesce',['get','name:ko'],['get','name']];}
        if(l['source-layer']==='boundary'&&l.id!=='boundary_2'){l.layout=Object.assign({},l.layout||{},{visibility:'none'});}});
      L.maplibreGL({style:st,attribution:'&copy; OpenFreeMap · OSM'}).addTo(MAP);
    }).catch(function(){esri();});
  }else{esri();}
  MAP.fitBounds([[37.478,126.905],[37.585,127.098]]);
  var lab=function(){document.getElementById('lmap').classList.toggle('nolab',MAP.getZoom()<10.5);};MAP.on('zoomend',lab);
  GL=L.geoJSON(DD.geo,{style:function(f){return guStyle(f.properties.name);},onEachFeature:function(f,ly){var nm=f.properties.name,n=DD.gu[nm]||0;glayers[nm]=ly;
    if(n){ly.bindTooltip(nm.replace('인천 ','')+' '+n,{permanent:true,direction:'center',className:'gul'});ly.on('click',function(){pickGu(nm,true);});}}}).addTo(MAP);
  var vs={};D.forEach(function(it){if(it.lat==null)return;var k=it.venue.split('(')[0].trim();(vs[k]=vs[k]||{lat:it.lat,lng:it.lng,gu:it.gu,list:[]}).list.push(it);});
  var COL={none:'#2f9e5b',retry:'#e8892b',done:'#d93a32'},LBL={none:'아직 안 가 봄',retry:'미탈출 · 재도전',done:'탈출 성공'};
  var mk=[];Object.keys(vs).forEach(function(k){var v=vs[k],n=v.list.length;
    var st=v.list.some(function(x){return x.retry;})?'retry':(v.list.some(function(x){return x.done;})?'done':'none');
    var html='<div class="popt"><b>'+esc(k)+'</b> <span class="muted">'+esc(v.gu)+' · '+n+'개</span><br>'+v.list.sort(function(a,b){return a.rank-b.rank;}).map(function(it){var tag=it.done?' <span style="color:#d93a32;font-weight:700">탈출 '+esc(it.done)+'</span>':(it.retry?' <span style="color:#e8892b;font-weight:700">미탈출 '+esc(it.retry)+'</span>':'');return '<a href="javascript:void(0)" onclick="goTheme('+it.rank+')">'+it.rank+'위 '+esc(it.name)+'</a>'+tag;}).join('<br>')+'</div>';
    var m=L.circleMarker([v.lat,v.lng],{radius:n>=4?8.5:7,color:'#fff',weight:2,fillColor:COL[st],fillOpacity:1}).bindTooltip(esc(k)+' · '+n+'개 · '+LBL[st],{direction:'top',offset:[0,-8]}).bindPopup(html).addTo(MAP);
    mk.push([m,st]);});
  mk.forEach(function(x){if(x[1]!=='none')x[0].bringToFront();});
  MAP.attributionControl.setPrefix(false);var lg=L.control({position:'topright'});lg.onAdd=function(){var d=L.DomUtil.create('div','legend');d.innerHTML='<span class="lg"><span class="dot" style="background:#2f9e5b"></span>안 가 본 곳</span><span class="lg"><span class="dot" style="background:#e8892b"></span>미탈출(재도전)</span><span class="lg"><span class="dot" style="background:#d93a32"></span>100% 탈출</span><span class="lg ln4 muted">회색 칸 = 테마 있는 구 · 누르면 그 구만</span>';return d;};lg.addTo(MAP);
  lab();}
function pickGu(g,fromMap){selGu=(selGu===g&&!fromMap)?'':g;if(GL)GL.setStyle(function(f){return guStyle(f.properties.name);});
  if(MAP&&selGu&&glayers[selGu])MAP.fitBounds(glayers[selGu].getBounds().pad(.15));renderGuList();
  if(selGu)setTimeout(function(){document.getElementById('gulist').scrollIntoView({behavior:'smooth',block:'start'});},150);}
function renderGuList(){var out=document.getElementById('gulist');
  var ks=Object.keys(DD.gu).sort(function(a,b){return DD.gu[b]-DD.gu[a];});
  var chips='<div class="bar">'+ks.map(function(g){return '<button class="'+(selGu===g?'on':'')+'" onclick="pickGu(\''+g+'\',true)">'+esc(g)+' '+DD.gu[g]+'</button>';}).join('')+'</div>';
  if(!selGu){out.innerHTML=chips+'<p class="muted">지도에서 구를 누르면(또는 위 버튼) 그 구의 테마가 추천순으로 나와요. 점은 매장 위치예요 — 초록 = 안 가 본 곳 · 주황 = 미탈출(재도전) · 빨강 = 100% 탈출.</p>';return;}
  var L2=D.filter(function(x){return x.gu===selGu;}).sort(function(a,b){return a.rank-b.rank;});
  out.innerHTML=chips+'<h2 class="gutitle">'+esc(selGu)+' <small class="muted">'+L2.length+'개 · 추천순</small></h2>'+listHtml(L2,false);}
function goTheme(rank){var it=D.filter(function(x){return x.rank===rank;})[0];if(!it)return;pickGu(it.gu,true);setTimeout(function(){var el=document.querySelector('#gulist #t'+rank);if(el){el.classList.add('open');el.scrollIntoView({behavior:'smooth',block:'center'});}},250);}
function renderRecs(){var R=DD.recs.slice().reverse();
  var h=R.map(function(x){var ph='<div class="ph"><span>'+esc(x.theme)+'</span>'+(x.img?'<img src="'+esc(thumb(x.img))+'" data-u="'+esc(x.img)+'" referrerpolicy="no-referrer" alt="" onerror="imgFail(this)">':'')+'</div>';
    var b=x.result==='clear'?'<span class="badge clear">탈출 성공</span>':'<span class="badge fail">엔딩 못 봄 · '+esc(x.progress||'')+'</span>';
    return '<div class="rec">'+ph+'<div class="tx"><div class="mt">'+esc(x.date.replace(/-/g,'.'))+'</div><div class="nm">'+esc(x.theme)+'</div><div class="vn">'+esc(x.venue)+(x.time?' · '+x.time+'분':'')+'</div><div style="margin-top:4px">'+b+'</div>'+(x.note?'<div class="mt" style="margin-top:4px">'+esc(x.note)+'</div>':'')+'</div></div>';}).join('');
  var re=D.filter(function(x){return x.retry;});
  var rb=re.length?'<div class="rbox"><h3>재도전 먼저 <small class="muted">엔딩을 못 본 테마</small></h3><ul>'+re.map(function(x){return '<li><b>'+esc(x.name)+'</b> · '+esc(x.venue)+' · '+esc(x.retry)+(x.url?' <a href="'+esc(x.url)+'" target="_blank" rel="noopener">예약 페이지</a>':'')+'</li>';}).join('')+'</ul></div>':'';
  document.getElementById('recs').innerHTML=rb+'<h2 class="gutitle">도전 기록 <small class="muted">'+R.length+'회 · 최근 순</small></h2>'+(h||'<p class="muted">아직 기록이 없어요.</p>');}
function tab(t){document.querySelectorAll('.rail button[data-t]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===t);});document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('on',p.id==='p-'+t);});
  if(t==='map'){initMap();setTimeout(function(){if(MAP)MAP.invalidateSize();},60);}window.scrollTo(0,0);}
document.querySelectorAll('.rail button[data-t]').forEach(function(b){b.addEventListener('click',function(){tab(b.getAttribute('data-t'));});});
document.querySelectorAll('[data-v]').forEach(function(b){b.addEventListener('click',function(){view=b.getAttribute('data-v');document.querySelectorAll('[data-v]').forEach(function(x){x.classList.toggle('on',x===b);});renderList();});});
document.getElementById('thr').addEventListener('click',function(){thrOnly=!thrOnly;this.classList.toggle('on',thrOnly);renderList();});
document.getElementById('left').addEventListener('click',function(){leftOnly=!leftOnly;this.classList.toggle('on',leftOnly);renderList();});
renderList();renderGuList();renderRecs();
var h0=(location.hash||'').replace('#','');if(h0==='map'||h0==='rec')tab(h0);
</script></body></html>
