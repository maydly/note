function prow(it,lead,btns,extra){var ph='<div class="ph">'+poster(it)+'</div>';return '<div class="prow"><div class="n">'+lead+'</div>'+ph+'<div class="t"><b>'+esc(it.name)+'</b><br><span class="muted">'+esc(it.venue)+' · '+esc(it.gu)+' · '+it.time+'분</span>'+(extra||'')+'</div>'+btns+'</div>';}
function renderPick(msg){var h='<div class="pk">';
  h+='<div class="how">① 이름을 넣고 ② 리스트에서 테마 카드의 <b>♡</b>를 눌러 가고 싶은 테마를 고르고 ③ 아래에서 <b>내 순위 10개</b>를 ▲▼로 정한 뒤 ④ <b>단톡에 보낼 링크</b>를 만들어 보내요. 친구가 보낸 링크를 열면 <b>모두의 순위</b>에 합쳐져요(1위 10점 … 10위 1점).</div>';
  if(msg)h+='<div class="note">'+esc(msg)+'</div>';
  h+='<h2>내 이름</h2><input id="pkname" maxlength="12" placeholder="예: 내 이름" value="'+esc(ME.name)+'" oninput="setName(this.value)">';
  h+='<h2>내 순위 10개 <small class="muted">'+ME.rank.length+'/10</small></h2>';
  h+=ME.rank.length?ME.rank.map(function(id,i){var it=BYID[id];return it?prow(it,i+1,'<div class="ctl"><button class="pb" onclick="mv(\''+id+'\',-1)">▲</button><button class="pb" onclick="mv(\''+id+'\',1)">▼</button></div><div class="ctl"><button class="pb" onclick="outTop(\''+id+'\')" title="10위에서 빼기">✕</button></div>'):'';}).join(''):'<p class="muted">리스트에서 ♡를 누르면 여기에 차례로 들어와요.</p>';
  var rest=ME.picks.filter(function(i){return ME.rank.indexOf(i)<0&&BYID[i];});
  h+='<h2>♡만 한 테마 <small class="muted">'+rest.length+'개 · 10위 안에 넣을 수 있어요</small></h2>';
  h+=rest.length?rest.map(function(id){var it=BYID[id];return prow(it,'♡','<div class="ctl">'+(ME.rank.length<10?'<button class="pb go" onclick="toTop(\''+id+'\')">10위 안에</button>':'')+'<button class="pb" onclick="togglePick(\''+id+'\')">♡ 빼기</button></div>');}).join(''):'<p class="muted">없어요.</p>';
  h+='<div class="share"><button onclick="makeLink()">단톡에 보낼 링크 만들기</button><button class="alt" onclick="copyLink()">링크 복사</button></div><div id="pkmsg" class="note"></div><div id="pklink" class="linkbox" style="display:none"></div>';
  // 모두의 순위
  var people={};if(ME.name)people[ME.name]={r:ME.rank,p:ME.picks.filter(function(i){return ME.rank.indexOf(i)<0;}),me:true};Object.keys(OT).forEach(function(n){if(n!==ME.name)people[n]=OT[n];});
  var sc={};Object.keys(people).forEach(function(n){var P=people[n];(P.r||[]).forEach(function(id,i){if(!BYID[id])return;(sc[id]=sc[id]||{s:0,w:[]}).s+=10-i;sc[id].w.push('<span class="who">'+esc(n)+' '+(i+1)+'위</span>');});
    (P.p||[]).forEach(function(id){if(!BYID[id])return;(sc[id]=sc[id]||{s:0,w:[]}).w.push('<span class="who h">'+esc(n)+' ♡</span>');});});
  var ids=Object.keys(sc).sort(function(a,b){return (sc[b].s-sc[a].s)||(sc[b].w.length-sc[a].w.length)||(BYID[a].rank-BYID[b].rank);});
  var names=Object.keys(people);
  h+='<h2>모두의 순위 <small class="muted">'+names.length+'명'+(names.length?' · '+esc(names.join(', ')):'')+'</small></h2>';
  h+=ids.length?ids.slice(0,30).map(function(id,i){var it=BYID[id];return prow(it,i+1,'<span class="sc">'+sc[id].s+'점</span>','<br>'+sc[id].w.join(''));}).join(''):'<p class="muted">아직 아무도 고르지 않았어요. 친구 링크를 열면 여기에 합쳐져요.</p>';
  var on=Object.keys(OT).filter(function(n){return n!==ME.name;});
  if(on.length)h+='<p class="muted" style="font-size:12.5px">받은 순위: '+on.map(function(n){return esc(n)+' <a href="javascript:void(0)" onclick="dropOther(\''+n.replace(/'/g,'')+'\')">빼기</a>';}).join(' · ')+'</p>';
  h+='</div>';document.getElementById('pick').innerHTML=h;}
var _tabOrig=tab;tab=function(t){_tabOrig(t);if(t==='pick')renderPick();};
renderList();
var _got=takeShared();
var h0=(location.hash||'').replace('#','');if(_got){tab('pick');renderPick(_got+'님의 순위를 «모두의 순위»에 합쳤어요.');}else if(h0==='map'||h0==='rec'||h0==='pick')tab(h0);
</script></body></html>
