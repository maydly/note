 `<p class="mlg"><span><i class="pin p-top"></i>1순위</span><span><i class="pin p-bal"></i>경치에 가게·교통도</span><span><i class="pin p-ex"></i>명진이 보낸 집</span><span><i class="pin p-old"></i>점수 주신 집</span><span><i class="pin p-mini"></i>짧게 본 곳</span><span><i class="apin"></i>공항</span><span><i class="sunm sunset" style="font-size:11px">일몰</i><i class="sunm sunrise" style="font-size:11px">일출</i> 명소(넓히면 이름)</span></p>`+
 `<p class="grp">번호로 찾기</p><div class="list">${H.map(h=>`<a class="lrow" href="#h=${h.key}" data-m="${h.key}"><i class="pin ${PCLS[h.grp]}">${h.i+1}</i><span class="ln">${esc(h.name)}</span><small>${esc(h.region)}</small></a>`).join('')}</div>`+
 `<p class="src">핀을 누르면 그 집 카드가 떠요. 핀이 겹친 곳은 누르면 그 자리로 커져요. 더 넓히면(두 손가락) 이름과 공항이 보여요.<br>숙소 위치는 에어비앤비가 보여 주는 대략 위치예요(몇백 m 차이 날 수 있어요). 지바·삿포로는 ‘일본 전체’를 누르면 보여요.</p>`;
 $('#app').innerHTML=x;window.scrollTo(0,0);
 loadLibs().then(()=>{if(location.hash!=='#map'||!$('#bigmap'))return;
  BIG=L.map('bigmap',{zoomControl:true,attributionControl:true,zoomSnap:.25,tap:false});addBase(BIG);
  Object.keys(AP).forEach(c=>{const a=AP[c];L.marker([a[1],a[2]],{icon:apIcon(),zIndexOffset:-1000,keyboard:false,interactive:false}).addTo(BIG).bindTooltip(a[0],{permanent:true,direction:'bottom',offset:[0,9],className:'aplab'})});
  H.forEach(h=>{const m=L.marker(h.ll,{icon:pinIcon(h),zIndexOffset:PZ[h.grp]+(19-h.i),riseOnHover:true,title:h.name}).addTo(BIG);
   m.bindTooltip(h.sn,{permanent:true,direction:'right',offset:[PSZ[h.grp]/2,0],className:'plab'});m.on('click',()=>{const p=BIG.latLngToContainerPoint(h.ll),near=H.filter(o=>o!==h&&BIG.latLngToContainerPoint(o.ll).distanceTo(p)<32);if(near.length&&BIG.getZoom()<11)BIG.flyToBounds(L.latLngBounds([h.ll].concat(near.map(o=>o.ll))),Object.assign({maxZoom:Math.min(BIG.getZoom()+3,12),duration:.6},FP));sel(h.key)})});

  const fk=sessionStorage.getItem('p7focus')||from;sessionStorage.removeItem('p7focus');
  if(fk&&byKey[fk]){BIG.setView(byKey[fk].ll,10);sel(fk)}else BIG.fitBounds(BIG._wb,FP);
  lab();setTimeout(()=>{if(BIG)BIG.invalidateSize()},80)
 }).catch(()=>{const c=$('#bigmap');if(c)c.innerHTML='<p class="mapfail">지도를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p>'})}

function miniMap(h){const el=$('#mm');if(!el)return;const a=AP[h.apc];
 const go=()=>loadLibs().then(()=>{if(!document.body.contains(el)||MM||cur!==h)return;
  MM=L.map(el,{zoomControl:false,attributionControl:true,dragging:false,touchZoom:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,tap:false});addBase(MM);
  L.marker([a[1],a[2]],{icon:apIcon(),keyboard:false,interactive:false}).addTo(MM).bindTooltip(a[0],{permanent:true,direction:'bottom',offset:[0,9],className:'aplab'});
  L.marker(h.ll,{icon:pinIcon(h),keyboard:false,interactive:false,zIndexOffset:1000}).addTo(MM).bindTooltip(h.sn,{permanent:true,direction:'right',offset:[PSZ[h.grp]/2,0],className:'plab'});
  const pts=[h.ll,[a[1],a[2]]];(h.spots||[]).forEach(([id])=>{const p=SP[id];L.marker([p.lat,p.lng],{icon:sunIcon(p.kind),keyboard:false,interactive:false}).addTo(MM);pts.push([p.lat,p.lng])});
  MM.fitBounds(L.latLngBounds(pts),{padding:[34,34],maxZoom:12});setTimeout(()=>{if(MM)MM.invalidateSize()},80)
 }).catch(()=>{el.innerHTML='<p class="mapfail">지도를 불러오지 못했어요</p>'});
 if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){io.disconnect();go()}},{rootMargin:'250px'});io.observe(el)}else go()}
