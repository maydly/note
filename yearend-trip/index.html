 {const a=AP[h.apc];x+=`<div class="card"><h3>위치 <small>${esc(h.region)} · 대략 위치</small></h3><div class="mm" id="mm"></div>`+

 if(h.ask&&h.ask.length)x+=`<div class="card dt"><details><summary>호스트에게 물어볼 것</summary><ul>${h.ask.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></details></div>`;
