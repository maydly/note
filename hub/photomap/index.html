<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>maydly · 대표 사진맵</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#f0f6ef;color:#2a352a;font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px 22px;text-align:center}
.wm{font-size:30px;font-weight:800;letter-spacing:-.6px}
.wm .d{color:#4f9a6a}
.sub{font-size:13px;color:#7a8a78;line-height:1.6;max-width:340px}
.card{background:#fff;border-radius:16px;padding:22px 20px;box-shadow:0 5px 16px rgba(79,120,79,.1);width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
button{font-size:15px;font-weight:700;padding:12px;border:none;border-radius:12px;background:#4f9a6a;color:#fff;cursor:pointer}
.msg{font-size:12.5px;min-height:16px;color:#7a8a78}
.msg.err{color:#c2564b}
.hint{font-size:11.5px;color:#9aa898;line-height:1.6}
</style>
</head>
<body>
<div class="wrap" id="gate">
  <div class="wm">maydly<span class="d">.</span></div>
  <div class="sub">대표 사진맵 — 명진·수빈 전용. 구글 로그인으로 사진을 불러옵니다.</div>
  <div class="card">
    <button onclick="doLogin()">구글로 로그인</button>
    <div class="msg" id="msg"></div>
    <div class="hint">토큰 필요 없어요. 명진·수빈 구글 계정만.</div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBfyRE7CNENjgSfe25xHAdr87gOllpYtvM",authDomain:"subin-routine.firebaseapp.com",projectId:"subin-routine"};
const app=initializeApp(cfg,"pmview"), auth=getAuth(app), db=getFirestore(app);
setPersistence(auth, browserLocalPersistence).catch(()=>{});
// ===== maydly 통합 로그인 (260929) =====
// 한 기기에서 구글 로그인 한 번이면 maydly 앱이 다 열리게 하는 추가 블록(「로그인 다리」).
//  · 이 사진맵(pmview)이 로그인 안 된 상태로 준비되면, 같은 Firebase 프로젝트의 다른 앱 이름
//    ([DEFAULT] 홈·설문·점검표·수빈 → mjcal 관리자 캘린더 → saju 명진앱 순)에 남은 로그인을 찾아 복사한다.
//  · 이 사진맵에 로그인돼 있고 [DEFAULT] 자리가 비어 있으면 거기에도 복사해 둔다(홈·설문이 바로 쓰게).
//  · 허용 계정(명진·수빈)만 복사한다. 그 밖의 계정 기록은 건드리지 않고 건너뛴다.
//  · 다른 앱의 기록은 먼저 저장소를 「읽기만」 해서 어디(localStorage / IndexedDB)에 있는지 확인한 뒤
//    그 저장소 그대로 연다 — Firebase 가 기록을 다른 저장소로 옮기면서 열려 있는 그 앱 탭이
//    잠깐 로그아웃되는 일을 막기 위해서다. DB 가 없으면 새로 만들지 않는다.
//  · 기존 로그인·사진 읽기 코드는 그대로다. 로그인되면 원래의 onAuthStateChanged 가 사진맵을 불러온다.
// 되돌리기: 이 블록(아래 「블록 끝」까지)을 통째로 지우면 원래대로.
import { getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { initializeAuth, indexedDBLocalPersistence, updateCurrentUser } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
(()=>{
  const SSO_ALLOWED=['bucket0825@gmail.com','ara030820@gmail.com'];
  const SSO_SOURCES=['[DEFAULT]','mjcal','saju'];
  const ssoKey=n=>'firebase:authUser:'+cfg.apiKey+':'+n;
  const ssoOk=u=>{ const em=(u&&typeof u.email==='string')?u.email.trim().toLowerCase():''; return !!em&&SSO_ALLOWED.indexOf(em)>=0; };
  const ssoWait=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(r,ms))]);
  function ssoReadLs(n){ try{ const s=localStorage.getItem(ssoKey(n)); return s?JSON.parse(s):null; }catch(e){ return null; } }
  function ssoReadIdb(n){ return new Promise(res=>{ try{
    if(!window.indexedDB) return res(null);
    const req=indexedDB.open('firebaseLocalStorageDb');
    req.onupgradeneeded=e=>{ try{ e.target.transaction.abort(); }catch(x){} };   // 없으면 만들지 않음
    req.onerror=e=>{ try{ e.preventDefault(); }catch(x){} res(null); };
    req.onblocked=()=>res(null);
    req.onsuccess=()=>{ const idb=req.result; try{
      if(!idb.objectStoreNames.contains('firebaseLocalStorage')){ idb.close(); return res(null); }
      const tx=idb.transaction('firebaseLocalStorage','readonly');
      const g=tx.objectStore('firebaseLocalStorage').get(ssoKey(n));
      g.onsuccess=()=>{ let v=g.result&&g.result.value; if(typeof v==='string'){ try{ v=JSON.parse(v); }catch(x){ v=null; } } res(v||null); };
      g.onerror=()=>res(null);
      tx.oncomplete=tx.onerror=tx.onabort=()=>{ try{ idb.close(); }catch(x){} };
    }catch(x){ try{ idb.close(); }catch(y){} res(null); } };
  }catch(e){ res(null); } }); }
  // 저장 기록 위치 확인(읽기만): {p: 그 저장 방식, u: 기록} 또는 null
  async function ssoStored(n){
    const l=ssoReadLs(n); if(l) return {p:browserLocalPersistence,u:l};
    const i=await ssoReadIdb(n); if(i) return {p:indexedDBLocalPersistence,u:i};
    return null;
  }
  // 그 이름의 앱을 이 페이지에서 연다(이미 있으면 재사용). 저장 방식은 기록이 있는 곳 하나만 → 기록 이동 없음
  function ssoAuthFor(n,p){
    const a=getApps().find(x=>x.name===n)||initializeApp(cfg,n);
    try{ return initializeAuth(a,{persistence:p}); }catch(e){ return getAuth(a); }
  }
  // (1) 가져오기: 이 앱이 로그아웃 상태일 때만
  async function ssoImport(){
    const ready=await ssoWait(auth.authStateReady().then(()=>true),10000);
    if(ready!==true||auth.currentUser) return;   // 이 앱 로그인 확인이 10초 안에 안 끝나면(느린 망·리다이렉트 복귀 중) 손대지 않음 — 원래 로그인을 덮지 않게
    for(const n of SSO_SOURCES){
      const s=await ssoStored(n);
      if(!s||!ssoOk(s.u)) continue;
      const other=ssoAuthFor(n,s.p);
      await ssoWait(other.authStateReady(),10000);
      const u=other.currentUser;
      if(!u||!ssoOk(u)) continue;
      if(auth.currentUser) return;          // 그사이 직접 로그인했으면 그대로 둠
      await updateCurrentUser(auth,u);
      return;
    }
  }
  // (2) [DEFAULT] 채우기: 이 앱에 허용 계정 로그인이 있고 [DEFAULT] 기록이 아예 없을 때만
  async function ssoFillDefault(u){
    if(!u||!ssoOk(u)) return;
    if(await ssoStored('[DEFAULT]')) return;   // 누구 기록이든 있으면 손대지 않음
    const d=ssoAuthFor('[DEFAULT]',browserLocalPersistence);
    const dReady=await ssoWait(d.authStateReady().then(()=>true),10000);
    if(dReady!==true||d.currentUser) return;
    await updateCurrentUser(d,u);
  }
  let ssoQ=Promise.resolve();
  const ssoRun=f=>{ ssoQ=ssoQ.then(f).catch(e=>console.warn('[maydly 통합 로그인]',e&&(e.code||e.message))); return ssoQ; };
  ssoRun(ssoImport).then(()=>{
    onAuthStateChanged(auth,u=>{ if(u&&ssoOk(u)) ssoRun(()=>ssoFillDefault(auth.currentUser)); });
  });
})();
// ===== 블록 끝: maydly 통합 로그인 (260929) =====
let manifest=null;
function setMsg(t,cls){ var m=document.getElementById('msg'); if(m){m.textContent=t||''; m.className='msg '+(cls||'');} }
async function loadManifest(){ if(manifest)return manifest; var d=await getDoc(doc(db,'photomap','_manifest')); if(!d.exists())throw new Error('아직 사진이 올라오지 않았어요'); manifest=d.data(); return manifest; }
// 앱이 쓸 월별 읽기 (window 전역 — document.write 후에도 유지)
window.pmReadMonth=async function(mk){ var mf=await loadManifest(); var n=(mf.months||{})[mk]; if(!n)return {}; var parts=[]; for(var i=0;i<n;i++){ var d=await getDoc(doc(db,'photomap',mk+'__'+i)); parts.push((d.exists()&&d.data().d)||''); } return JSON.parse(parts.join('')); };
async function readApp(){ var mf=await loadManifest(); var n=mf.app||0; var parts=[]; for(var i=0;i<n;i++){ var d=await getDoc(doc(db,'photomap','_app__'+i)); parts.push((d.exists()&&d.data().d)||''); } return parts.join(''); }
window.doLogin=async function(){ setMsg('로그인 중…'); try{ await signInWithPopup(auth,new GoogleAuthProvider()); }catch(e){
  if(e.code==='auth/popup-blocked'||e.code==='auth/cancelled-popup-request'){ try{ await signInWithRedirect(auth,new GoogleAuthProvider()); }catch(e2){ setMsg('로그인 실패: '+(e2.code||e2.message),'err'); } }
  else setMsg(e.code==='auth/unauthorized-domain'?'이 주소가 Firebase 허용목록에 없어요':'로그인 실패: '+(e.code||e.message),'err'); } };
getRedirectResult(auth).catch(()=>{});
onAuthStateChanged(auth, async (user)=>{
  if(!user)return;
  setMsg('사진맵 불러오는 중…');
  try{ var html=await readApp(); document.open(); document.write(html); document.close(); }
  catch(e){ setMsg(e.message||'불러오기 실패','err'); }
});
</script>
</body>
</html>
