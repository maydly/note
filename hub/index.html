body{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 46px) 20px calc(env(safe-area-inset-bottom) + 50px)}

/* 헤더 */
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}

/* 4열 타일 그리드 (폰 기준) */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{position:relative;text-decoration:none;color:#fff;border-radius:16px;padding:9px;aspect-ratio:1/1;
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  box-shadow:0 5px 13px rgba(90,70,50,.14);transition:transform .16s,box-shadow .16s}
.tile:active{transform:scale(.96)}
@media(hover:hover){.tile:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(90,70,50,.22)}}
.tile .ic{font-size:21px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.42);border-radius:13px;box-shadow:0 2px 7px rgba(70,60,45,.13), inset 0 0 0 1px rgba(255,255,255,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.tile .lb{font-size:11px;font-weight:750;letter-spacing:-.3px;line-height:1.15;text-shadow:0 1px 3px rgba(0,0,0,.12)}
.tile .sm{font-size:8px;opacity:.86;margin-top:1px;font-weight:500;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.1);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .arw{position:absolute;top:8px;right:9px;font-size:10px;opacity:.65}
.tile.wide{grid-column:1/-1;aspect-ratio:auto;flex-direction:row;align-items:center;gap:15px;padding:18px 20px}
.tile.wide .ic{font-size:29px}
.tile.wide .wtx{flex:1;min-width:0}
.tile.wide .arw{position:static;opacity:.75}
.tile.soon{opacity:.62}
.tile .soonbadge{position:absolute;top:15px;right:14px;font-size:10px;font-weight:700;background:rgba(255,255,255,.32);
  padding:3px 9px;border-radius:20px;backdrop-filter:blur(4px)}
.foot{text-align:center;margin-top:24px;font-size:11.5px;color:#a99e8f;line-height:1.6}

/* PIN 게이트 */
.gate{position:fixed;inset:0;background:#f0f6ef url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'112'%20height%3D'112'%3E%3Cg%20fill%3D'%234f9a6a'%20fill-opacity%3D'0.035'%3E%3Cg%20transform%3D'translate(28%2C28)'%3E%3Cpath%20d%3D'M0%200%20C-2.4%2C-10.5%20-17%2C-15.5%20-17%2C-27.5%20C-17%2C-36.5%20-8%2C-40.5%200%2C-32.5%20C8%2C-40.5%2017%2C-36.5%2017%2C-27.5%20C17%2C-15.5%202.4%2C-10.5%200%2C0%20Z'%20transform%3D'scale(0.46)%20rotate(0)'%2F%3E%3Cpath%20d%3D'M0%200%20C-2.4%2C-10.5%20-17%2C-15.5%20-17%2C-27.5%20C-17%2C-36.5%20-8%2C-40.5%200%2C-32.5%20C8%2C-40.5%2017%2C-36.5%2017%2C-27.5%20C17%2C-15.5%202.4%2C-10.5%200%2C0%20Z'%20transform%3D'scale(0.46)%20rotate(90)'%2F%3E%3Cpath%20d%3D'M0%200%20C-2.4%2C-10.5%20-17%2C-15.5%20-17%2C-27.5%20C-17%2C-36.5%20-8%2C-40.5%200%2C-32.5%20C8%2C-40.5%2017%2C-36.5%2017%2C-27.5%20C17%2C-15.5%202.4%2C-10.5%200%2C0%20Z'%20transform%3D'scale(0.46)%20rotate(180)'%2F%3E%3Cpath%20d%3D'M0%200%20C-2.4%2C-10.5%20-17%2C-15.5%20-17%2C-27.5%20C-17%2C-36.5%20-8%2C-40.5%200%2C-32.5%20C8%2C-40.5%2017%2C-36.5%2017%2C-27.5%20C17%2C-15.5%202.4%2C-10.5%200%2C0%20Z'%20transform%3D'scale(0.46)%20rotate(270)'%2F%3E%3C%2Fg%3E%3Cg%20transform%3D'translate(84%2C86)'%3E%3Cpath%20d%3D'M0%200%20C-2.4%2C-10.5%20-17%2C-15.5%20-17%2C-27.5%20C-17%2C-36.5%20-8%2C-40.5%200%2C-32.5%20C8%2C-40.5%2017%2C-36.5%2017%2C-27.5%20C17%2C-15.5%202.4%2C-10.5%200%2C0%20Z'%20transform%3D'scale(0.32)%20rotate(0)'%2F%3E%3Cpath%20d%3D'M0%200%20C-2.4%2C-10.5%20-17%2C-15.5%20-17%2C-27.5%20C-17%2C-36.5%20-8%2C-40.5%200%2C-32.5%20C8%2C-40.5%2017%2C-36.5%2017%2C-27.5%20C17%2C-15.5%202.4%2C-10.5%200%2C0%20Z'%20transform%3D'scale(0.32)%20rotate(90)'%2F%3E%3Cpath%20d%3D'M0%200%20C-2.4%2C-10.5%20-17%2C-15.5%20-17%2C-27.5%20C-17%2C-36.5%20-8%2C-40.5%200%2C-32.5%20C8%2C-40.5%2017%2C-36.5%2017%2C-27.5%20C17%2C-15.5%202.4%2C-10.5%200%2C0%20Z'%20transform%3D'scale(0.32)%20rotate(180)'%2F%3E%3Cpath%20d%3D'M0%200%20C-2.4%2C-10.5%20-17%2C-15.5%20-17%2C-27.5%20C-17%2C-36.5%20-8%2C-40.5%200%2C-32.5%20C8%2C-40.5%2017%2C-36.5%2017%2C-27.5%20C17%2C-15.5%202.4%2C-10.5%200%2C0%20Z'%20transform%3D'scale(0.32)%20rotate(270)'%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E");z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.gate .gw{font-size:34px;font-weight:800;letter-spacing:-.8px}
.gate .gw .d{color:#4f9a6a}
.gate .gs{font-size:13px;color:#a2988c;margin-top:-4px}
.pinrow{display:flex;gap:9px;margin-top:8px;width:100%;max-width:320px}
.pin{flex:1;min-width:0;font-size:18px;text-align:center;letter-spacing:6px;
  padding:14px 16px;border:1.5px solid #e2dace;border-radius:14px;background:#fff;color:#2e2a26;outline:none}
.pin:focus{border-color:#4f9a6a}
.gobtn{flex:0 0 auto;border:none;background:#4f9a6a;color:#fff;font-size:16px;font-weight:700;
  padding:14px 22px;border-radius:14px;cursor:pointer}
.gobtn:active{opacity:.85}
.err{font-size:12.5px;color:#c2564b;min-height:16px}
.toast{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);background:rgba(46,42,38,.9);color:#fff;
  font-size:13px;font-weight:600;padding:11px 18px;border-radius:22px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1}

/* ══ v2.5 아이폰 (260930) — 추가만(기존 타일·PIN·디자인 그대로) ══
   글자 자동 확대 막기 · 타일을 길게 눌러도 글자 선택 안 됨 ·
   홈 화면 앱에서 maydly 앱을 사파리 겹창(저장소 따로 → PIN·로그인 다시) 대신 이 창 안에서 크게 열고 «‹ 허브»로 돌아오기 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.tile{-webkit-user-select:none;user-select:none}
/* 홈 화면 앱: 타일을 길게 눌러 뜨는 링크 미리보기·메뉴 끄기(거기서 열면 크게 열기를 건너뛰고 사파리 겹창 — 저장소가 따로라 PIN·로그인이 끊긴다) */
html.standalone .tile{-webkit-touch-callout:none}
html.ovopen,html.ovopen body{overflow:hidden}
.ov{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;background:#f0f6ef;animation:ovIn .24s cubic-bezier(.2,.75,.25,1)}
.ov[hidden]{display:none}
.ov:focus{outline:none}
@keyframes ovIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.ovbar{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 4px) max(8px,env(safe-area-inset-right)) 4px max(6px,env(safe-area-inset-left));
  background:rgba(250,253,249,.97);border-bottom:1px solid #e3e9e0;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ovback{flex:0 0 auto;display:inline-flex;align-items:center;gap:1px;height:44px;padding:0 12px 0 4px;border:0;border-radius:12px;background:transparent;
  color:#2d6a3e;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.ovback svg{width:24px;height:24px}
.ovt{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:750;letter-spacing:-.3px}
.ovt .oi{width:26px;height:26px;border-radius:8px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 3px 8px -4px rgba(90,70,50,.4)}
.ovt .onm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovbtn{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:#5d6b5f;cursor:pointer}
.ovbtn svg{width:20px;height:20px}
.ovback:active,.ovbtn:active{background:#e6efe3}
.ovbody{position:relative;flex:1 1 auto;min-height:0;background:#fff;transition:background-color .2s}
/* 가로 모드: 노치·다이내믹 아일랜드 쪽(좌우 안전 영역)은 비워 둔다 — 끼운 쪽들은 좌우 안전 영역을 스스로 챙기지 않는다.
   아래: 기본은 홈 막대 위에서 멈춘다. 끼운 쪽이 안전 영역 값을 그대로 받는 기기면(아이폰 사파리) .fullb — 바닥까지 채우고 쪽이 스스로 비운다(두 번 비지 않게).
   남는 띠는 끼운 쪽 바탕색으로 칠한다(JS) */
.ovbody iframe{position:absolute;left:env(safe-area-inset-left,0px);top:0;width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));
  height:calc(100% - env(safe-area-inset-bottom,0px));border:0;background:#fff}
.ovbody.fullb iframe{height:100%}
.ovph{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:12.5px;font-weight:600;color:#7c8a7d;background:#f0f6ef;transition:opacity .3s ease}
.ovph .oic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 5px 13px rgba(90,70,50,.14);animation:ovp 1.4s ease-in-out infinite}
.ovph .fpo{display:block;width:64px;height:64px;padding:12px;box-sizing:content-box;border-radius:50%;background:#fff;box-shadow:0 8px 22px -10px rgba(63,143,92,.45),inset 0 0 0 1px #e4ede1}
.ovph.orbon .oic{display:none}
.ovph.done{opacity:0;pointer-events:none}
.ovph .slw{display:none;text-align:center;padding:0 30px;line-height:1.6}
.ovph.slow .slw{display:block}
.ovph.slow .ovpt{display:none}
@keyframes ovp{50%{transform:scale(.92);opacity:.72}}
@media(prefers-reduced-motion:reduce){ .ov,.ovph .oic{animation:none} }

/* ══ v2.6 아이폰 글씨 (260930) — 추가만(타일 색·아이콘·배치 그대로) ══
   설명 8→10px 로 키워 폰에서 읽히게 · 이름은 띄어쓰기 자리에서만 꺾이게(「점검/표」처럼 단어 중간 꺾임 없음).
   타일은 최소 정사각형을 유지하고, 글이 넘칠 때만 세로로 조금 커진다(한 줄 안의 타일 높이는 같게).
   폰·태블릿(좁은 화면 또는 손가락 입력)에서만 — 데스크톱 모양은 그대로.
   되돌리기: 이 블록만 지우면 원래대로. */
@media (max-width:900px), (pointer:coarse){
  .grid{align-items:stretch}
  .tile:not(.wide){aspect-ratio:auto;min-height:calc((min(100vw,460px) - 64px)/4);gap:4px}
  .tile .lb{font-size:11.5px;line-height:1.15;word-break:keep-all;overflow-wrap:anywhere}
  .tile .sm{font-size:10px;line-height:1.25;margin-top:2px}
}
</style>

<body>

<!-- PIN 게이트 -->
<div class="gate" id="gate">
  <div class="gw">maydly<span class="d">.</span></div>
  <div class="gs">개인 허브 · 명진 &amp; 수빈</div>
  <div class="pinrow">
    <input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]*"
      placeholder="PIN" maxlength="8" autocomplete="off" onkeydown="if(event.key==='Enter')tryPin()">
    <button class="gobtn" onclick="tryPin()">입장</button>
  </div>
  <div class="err" id="err"></div>
</div>

<!-- 허브 본문 -->
<div id="app" style="display:none">
  <div class="head"><div class="wm">maydly<span class="d">.</span><svg width='22' height='22' viewBox='0 0 40 40' style='vertical-align:-3px;margin-left:4px'><g fill='#4f9a6a'><path d='M20,20 C16,14 8,13 8,8 C8,4.5 13,3.5 16,6 C18,7.5 19.5,9 20,10.5 C20.5,9 22,7.5 24,6 C27,3.5 32,4.5 32,8 C32,13 24,14 20,20 Z'/><path transform='rotate(90 20 20)' d='M20,20 C16,14 8,13 8,8 C8,4.5 13,3.5 16,6 C18,7.5 19.5,9 20,10.5 C20.5,9 22,7.5 24,6 C27,3.5 32,4.5 32,8 C32,13 24,14 20,20 Z'/><path transform='rotate(180 20 20)' d='M20,20 C16,14 8,13 8,8 C8,4.5 13,3.5 16,6 C18,7.5 19.5,9 20,10.5 C20.5,9 22,7.5 24,6 C27,3.5 32,4.5 32,8 C32,13 24,14 20,20 Z'/><path transform='rotate(270 20 20)' d='M20,20 C16,14 8,13 8,8 C8,4.5 13,3.5 16,6 C18,7.5 19.5,9 20,10.5 C20.5,9 22,7.5 24,6 C27,3.5 32,4.5 32,8 C32,13 24,14 20,20 Z'/></g><path d='M20,20 Q21,29 25,34' stroke='#4f9a6a' stroke-width='2' fill='none' stroke-linecap='round'/></svg></div><div class="who">명진 · 수빈</div></div>
  <div class="grid" id="grid"></div>
  <div class="foot">홈 화면에 추가해 앱처럼 쓰세요<br>명진 · 수빈 전용</div>

    clearTimeout(timer);
    if(orb){try{orb.stop();}catch(e){}orb=null;}
    Array.prototype.slice.call(body.querySelectorAll('iframe')).forEach(function(f){try{f.src='about:blank';}catch(e){}});
    body.innerHTML='';body.classList.remove('fullb');body.style.backgroundColor='';
    ov.hidden=true;document.documentElement.classList.remove('ovopen');
    if(!quiet&&from&&from.isConnected){try{from.focus({preventScroll:true});}catch(e){}}
    from=null;
  }
  // 허브 주소인지 — 'dock'(이 독바 /note/hub/) · 'home'(홈 대시보드 /note/hub/home/) · ''(그 밖)
  function hubKind(href){
    var u;try{u=new URL(href,location.href);}catch(e){return '';}
    if(u.origin!==location.origin&&u.origin!=='https://maydly.github.io')return '';
    var p=u.pathname.replace(/index\.html$/,'');
    if(/\/note\/hub\/$/.test(p))return 'dock';
    if(/\/note\/hub\/home\/(preview\.html)?$/.test(p))return 'home';
    return '';
  }
  // 크게 연 앱 안의 «← 허브»(명진앱 머리 · 필름 · 점검표 · 떠 있는 버튼) = 이 창을 닫고 독바로. 홈 대시보드 링크면 닫고 같은 창에서 홈으로
  function onHub(k){close();if(k==='home')location.href=new URL('home/',location.href).href;}
  // 끼운 쪽이 안전 영역 값을 받는지 재 보고(아이폰 사파리는 부모 값을 그대로 넘긴다고 알려짐) 바닥 채움을 정하고, 남는 띠를 쪽 바탕색으로 칠한다
  function fit(f){
    try{
      var d=f.contentDocument,w=f.contentWindow;if(!d||!w)return;
      var pb=d.createElement('div');
      pb.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
      (d.body||d.documentElement).appendChild(pb);
      var cs=w.getComputedStyle(pb),pass=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingRight)||0)+(parseFloat(cs.paddingBottom)||0)+(parseFloat(cs.paddingLeft)||0)>0;
      pb.parentNode.removeChild(pb);
      body.classList.toggle('fullb',pass);
      var bg=function(el){var c=el?w.getComputedStyle(el).backgroundColor:'';return c&&c!=='transparent'&&!/rgba\([^)]*,\s*0\)$/.test(c)?c:'';};
      body.style.backgroundColor=bg(d.body)||bg(d.documentElement)||'#fff';
    }catch(e){}
  }
  // 창 안 쪽이 뜰 때마다(첫 쪽뿐 아니라 안에서 다음 쪽으로 넘어가도) — 저장 없음, 끼운 쪽 화면에만 손댄다
  function embed(f){
    var d,w;try{d=f.contentDocument;w=f.contentWindow;}catch(e){return false;}
    if(!d||!w)return false;
    var k='';try{k=hubKind(w.location.href);}catch(e){}
    if(k){onHub(k);return true;}   // 스크립트로 허브에 들어와 버린 경우까지 — 독바 안에 독바가 겹치지 않게
    try{if(d.head&&!d.getElementById('mh-embed-css')){var st=d.createElement('style');st.id='mh-embed-css';st.textContent='#maydlyHubBtn{display:none!important}';d.head.appendChild(st);}}catch(e){}
    try{if(!d.__mhHub){d.__mhHub=1;d.addEventListener('click',function(ev){
      if(ev.defaultPrevented||ev.button>0||ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.altKey)return;
      var a=ev.target&&ev.target.closest?ev.target.closest('a[href]'):null;if(!a)return;
      var k2=hubKind(a.href);if(!k2)return;
      ev.preventDefault();ev.stopPropagation();onHub(k2);
    },true);}}catch(e){}
    fit(f);f.__mhFit=1;
    return false;
  }
  window.addEventListener('resize',function(){if(ov.hidden)return;var f=body.querySelector('iframe');if(f&&f.__mhFit)fit(f);});
  function open(url,a,l){
    close(true);
    cur=url;from=a;
    var g=l?'linear-gradient(150deg,'+l.g[0]+','+l.g[1]+')':'linear-gradient(150deg,#a9cfae,#7fb489)';
    var nm=l?l.lb:'maydly';
    on.textContent=nm;oi.style.background=g;oi.textContent=l?l.ic:'🍀';
    ext.href=url;share.hidden=!(navigator.share||(navigator.clipboard&&navigator.clipboard.writeText));
    var ph=document.createElement('div');ph.className='ovph';ph.setAttribute('aria-hidden','true');
    ph.innerHTML='<span class="oic"></span><span class="ovpt"></span><span class="slw">느리게 열리고 있어요 — 조금 더 기다리거나 오른쪽 위 ↗ 로 사파리에서 열 수 있어요</span>';
    ph.querySelector('.oic').style.background=g;ph.querySelector('.oic').textContent=l?l.ic:'🍀';
    ph.querySelector('.ovpt').textContent=nm+' 여는 중…';
    var f=document.createElement('iframe');f.title=nm;f.setAttribute('allow','clipboard-write; geolocation; fullscreen');
    body.appendChild(ph);body.appendChild(f);
    var done=false;
    f.addEventListener('load',function(){
      if(!f.getAttribute('src'))return;
      if(embed(f))return;             // 매번 — 떠 있는 «← 허브» 숨김 · 허브 링크 가로채기 · 안전 영역 맞춤
      if(done)return;                 // ↓ 자리표시·구슬 치우기는 처음 한 번만
      done=true;clearTimeout(timer);
      if(orb){try{orb.stop();}catch(e){}orb=null;}
      ph.classList.add('done');setTimeout(function(){if(ph.parentNode)ph.parentNode.removeChild(ph);},320);
    });
    timer=setTimeout(function(){if(!done)ph.classList.add('slow');},12000);
    (orbMod||(orbMod=import('./home/orbs.js').catch(function(){return null;}))).then(function(m){
      if(!m||done||!ph.isConnected)return;
      var slot=document.createElement('span');slot.className='fpo';ph.insertBefore(slot,ph.firstChild);ph.classList.add('orbon');
      try{orb=m.mountOrb(slot,{state:'working',size:64,label:nm+' 여는 중'});}catch(e){ph.classList.remove('orbon');}
    });
    f.setAttribute('src',url);
    ov.hidden=false;document.documentElement.classList.add('ovopen');
    try{ov.focus({preventScroll:true});}catch(e){}
  }
  $('ov-close').addEventListener('click',function(){close();});
  share.addEventListener('click',send);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!ov.hidden)close();});
  document.addEventListener('click',function(ev){
    if(ev.defaultPrevented||ev.button>0||ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.altKey)return;
    var a=ev.target&&ev.target.closest?ev.target.closest('a.tile'):null;
    if(!a||a.getAttribute('target')!=='_blank')return;
    var u;try{u=new URL(a.href,location.href);}catch(e){return;}
    if(u.origin!==location.origin)return;   // 다른 주소 — 지금처럼 겹창
    ev.preventDefault();ev.stopPropagation();
    open(u.href,a,info(a.getAttribute('href')));
  },true);
})();
// ===== 블록 끝: v2.5 아이폰 홈 화면 앱 (260930) =====
</script>
