<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>여행지도 · 일본 & 국내 (maydly)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="common.css?v=3">
<style>
/* 실지도 전용 핀 */
.lp{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);cursor:pointer}
.lp .dot{width:30px;height:30px;border-radius:50% 50% 50% 2px;background:var(--clover);transform:rotate(45deg);
  box-shadow:0 3px 8px rgba(60,90,60,.4);display:grid;place-items:center;border:2px solid #fff}
.lp .dot b{transform:rotate(-45deg);font-size:14px;line-height:1}
.lp .lab{margin-top:5px;background:rgba(255,255,255,.94);padding:2px 8px;border-radius:999px;font-size:11.5px;
  font-weight:700;color:var(--ink);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.lp:hover .dot{background:var(--clover-deep)}
.leaflet-container{background:#dcebf2;font-family:inherit}
/* 국가 전환 탭 (topbar 아래 고정) */
.ctabs{position:fixed;top:56px;left:0;right:0;z-index:640;display:flex;gap:6px;padding:7px 12px;background:var(--bg,#faf8f3);border-bottom:1px solid var(--line,#e8e2d5)}
#map{top:108px !important}          /* topbar56 + ctabs52 */
.search-box{top:118px !important}
.ctab{flex:1 1 0;min-width:0;padding:9px 4px;border-radius:11px;border:1px solid var(--line,#e8e2d5);background:#fff;color:var(--sub,#7d7566);
  font-weight:750;font-size:.82rem;cursor:pointer;transition:all .15s;letter-spacing:-.45px;white-space:nowrap;overflow:hidden}
.ctabs{gap:5px;padding:7px 9px}
.ctab.on{background:var(--clover,#4c8c4a);color:#fff;border-color:var(--clover,#4c8c4a);box-shadow:0 2px 8px rgba(76,140,74,.28)}
.maploading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(250,248,243,.85);
  z-index:400;font-weight:700;color:var(--clover,#4c8c4a)}
.maploading.on{display:flex}
/* 내 장소 저장 */
.myfab{position:fixed;right:14px;bottom:18px;z-index:700;display:none;flex-direction:column;gap:9px;align-items:flex-end}
.myfab button{border:none;border-radius:999px;font-weight:750;font-size:13.5px;cursor:pointer;box-shadow:0 4px 14px rgba(50,70,55,.28);font-family:inherit;padding:11px 16px}
.myfab .mf-add{background:var(--clover,#4c8c4a);color:#fff}
.myfab .mf-add.arm{background:#e0663c}
.myfab .mf-list{background:#fff;color:var(--ink);font-size:12.5px;padding:9px 14px}
.myfab .mf-gev{background:#1f6f8b;color:#fff;font-weight:750;text-decoration:none;text-align:center;
  border-radius:999px;box-shadow:0 4px 14px rgba(50,70,55,.28);font-size:13.5px;padding:11px 16px;display:block}
.sp-btns a.sb-gev{display:flex;align-items:center;justify-content:center;text-decoration:none;
  flex:1 1 0;min-width:0;border-radius:8px;padding:9px 2px;font-size:11px;font-weight:750;color:#fff;white-space:nowrap}
.pp-btns a.sb-gev{display:block;text-align:center;text-decoration:none;border-radius:8px;padding:10px;
  font-size:13px;font-weight:700;color:#fff}
.mtip{position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:660;background:rgba(224,102,60,.96);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:650;display:none;box-shadow:0 4px 14px rgba(0,0,0,.2);white-space:nowrap}
.mtip.on{display:block}
.mypin{width:26px;height:26px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);font-size:12px}
.mypin b{transform:rotate(-45deg);line-height:1}
.pmodal,.plist-sheet{position:fixed;inset:0;z-index:1000;background:rgba(20,30,24,.45);display:none;align-items:flex-end;justify-content:center}
.pmodal.on,.plist-sheet.on{display:flex}
.pbox,.plbox{background:#fff;width:min(460px,100%);border-radius:18px 18px 0 0;padding:20px}
.plbox{max-height:75vh;overflow-y:auto}
.pbox{max-height:88vh;overflow-y:auto}
.pbox h3,.plbox h3{margin:0 0 14px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.pcats{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
.pcats button{flex:1 1 21%;min-width:62px;padding:10px 4px;border:1.5px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:650;color:var(--sub)}
.pcats button.on{border-color:var(--clover);background:var(--clover-soft,#eef4ec);color:var(--clover-deep,#357a51)}
.pbox input,.pbox textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;margin-bottom:10px;color:var(--ink)}
.pbox textarea{resize:vertical;min-height:56px}
.pbtns{display:flex;gap:8px;margin-top:4px}
.pbtns button{flex:1;padding:12px;border:none;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.pbtns .psave{background:var(--clover,#4c8c4a);color:#fff}
.pbtns .pcancel{background:#eee;color:var(--ink)}
/* 장소 검색으로 추가 (260911) — 지도에서 좌표를 찍는 대신 이름으로 찾는다 */
.psearch{display:flex;gap:7px;margin-bottom:9px}
.psearch input{flex:1;margin-bottom:0!important}
.psearch button{flex:0 0 auto;padding:0 15px;border:none;border-radius:10px;background:var(--clover,#4c8c4a);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
.psearch button:disabled{opacity:.5;cursor:default}
.psr{max-height:172px;overflow-y:auto;margin-bottom:10px;display:none}
.psr.on{display:block}
.psr-item{padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff}
.psr-item:hover{border-color:var(--clover,#4c8c4a);background:var(--clover-soft,#eef4ec)}
.psr-item b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:2px}
.psr-item span{display:block;font-size:11.5px;color:var(--sub);line-height:1.45}
.psr-msg{padding:10px 2px;font-size:12.5px;color:var(--sub)}
.ploc{font-size:12.5px;padding:9px 12px;border-radius:10px;background:#f4f2ec;color:var(--sub);margin-bottom:11px;line-height:1.5}
.ploc.set{background:var(--clover-soft,#eef4ec);color:var(--clover-deep,#357a51);font-weight:650}
.ploc .pmini{display:block;margin-top:5px;font-size:11.5px;color:var(--sub);font-weight:400}
.ploc-alt{display:block;background:none;border:none;padding:0;margin-top:6px;font-size:11.5px;color:#7a6a55;text-decoration:underline;cursor:pointer;font-family:inherit;text-align:left}
/* ── 길찾기 (260913) ── */
.rt-card{position:fixed;left:10px;right:10px;bottom:10px;z-index:900;background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:0 6px 26px rgba(0,0,0,.22);padding:12px 14px;display:none;font-size:13px}
.rt-card.on{display:block}
.rt-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.rt-head b{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-x{border:none;background:#eef1f5;border-radius:8px;width:28px;height:28px;font-size:15px;cursor:pointer;flex:none}
.rt-sum{color:#4a4f57;line-height:1.6;margin-bottom:9px}
.rt-sum .rt-n{font-weight:800;color:#1f6f8b}
.rt-btns{display:flex;gap:5px;flex-wrap:wrap}
.rt-btns a,.rt-btns button{flex:1 1 30%;min-width:96px;text-align:center;text-decoration:none;border:none;
  border-radius:9px;padding:10px 4px;font-size:12px;font-weight:750;color:#fff;cursor:pointer;font-family:inherit}
.rt-nv{background:#03c75a} .rt-gg{background:#4285f4} .rt-kk{background:#f7d00b;color:#3c1e1e !important}
.rt-note{color:#8b9098;font-size:11.5px;margin-top:8px;line-height:1.5}
.rt-nav{margin-top:8px}
.rt-go{width:100%;border:none;border-radius:9px;padding:11px;font-size:13px;font-weight:800;
  color:#fff;background:#1f6f8b;cursor:pointer;font-family:inherit}
.rt-go.stop{background:#c2557a}
.rt-live{margin-top:8px;background:#eef6fb;border:1px solid #cfe3ef;border-radius:10px;padding:10px 11px}
.rt-live .rt-next{font-size:15px;font-weight:800;color:#15414f;line-height:1.4}
.rt-live .rt-left{color:#4a4f57;font-size:12px;margin-top:3px}
.rt-live .rt-off{color:#c2557a;font-size:12px;margin-top:4px;font-weight:700}
.rt-delay{color:#c2557a;font-weight:700}
.rt-ontime{color:#1f8b4c;font-weight:700}
.rt-tabs{display:flex;gap:4px;margin-bottom:8px}
.rt-tabs .rt-tab{flex:1 1 0;min-width:0;border:1px solid var(--line);background:#fff;color:#4a4f57;
  border-radius:8px;padding:7px 2px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-tabs .rt-tab.on{background:#1f6f8b;border-color:#1f6f8b;color:#fff}
.rt-legs{margin-top:8px;border-top:1px solid var(--line);padding-top:7px;max-height:172px;overflow-y:auto}
.rt-leg{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12.5px}
.rt-leg i{width:4px;align-self:stretch;min-height:15px;border-radius:2px;flex:none}
.rt-leg .rt-lm{flex:none;color:#2b2f36}
.rt-leg .rt-lt{color:#8b9098;flex:none;font-size:11.5px}
.rt-leg .rt-ld{color:#6b7280;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.rt-alt{color:#8b9098;font-size:11.5px;margin-top:5px}

/* 내 위치 (260911) — 지금 서 있는 자리에서 바로 저장하는 흐름 */
.locbtn{position:fixed;right:14px;bottom:216px;z-index:650;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:19px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.18);display:none;align-items:center;justify-content:center;padding:0}
.locbtn.on{display:flex}
.medot{width:16px;height:16px;border-radius:50%;background:#2f7fd6;border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(47,127,214,.5),0 2px 6px rgba(0,0,0,.3)}
.mepop{text-align:center;min-width:130px}
.mepop b{font-size:13.5px}
.mepop .meacc{display:block;font-size:11px;color:var(--sub);margin:2px 0 7px}
.mepop button{padding:9px 15px;border:none;border-radius:9px;background:var(--clover,#4c8c4a);color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.plitem{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.plitem .pe{font-size:20px}
.plitem .pin{flex:1;min-width:0}
.plitem .pnm{font-weight:700;font-size:14px}
.plitem .pmemo{font-size:12.5px;color:var(--sub);margin-top:2px;word-break:break-word}
.plitem .pdel{border:none;background:none;color:#c55;cursor:pointer;font-size:12.5px;font-weight:600;flex:0 0 auto}
.plempty{color:var(--sub);text-align:center;padding:30px 0;font-size:13.5px;line-height:1.7}
.xbtn{border:none;background:none;font-size:18px;cursor:pointer;color:var(--sub)}
.mypin.live{border-style:dashed;box-shadow:0 2px 7px rgba(60,140,90,.5)}
.sync-intro{font-size:12.5px;color:var(--sub);line-height:1.65;background:var(--clover-soft,#eef4ec);padding:11px 13px;border-radius:11px;margin-bottom:13px}
.sync-add{margin:6px 0 4px}
.sync-add input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13.5px;font-family:inherit;margin-bottom:8px;color:var(--ink)}
.sync-row{display:flex;gap:8px}
.sync-row select{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:13px;color:var(--ink);background:#fff}
.sync-add-btn{flex:0 0 auto;padding:10px 18px;border:none;border-radius:10px;background:var(--clover,#4c8c4a);color:#fff;font-weight:700;font-family:inherit;cursor:pointer}
.sync-file{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.sync-file button{width:100%;padding:11px;border:1px dashed var(--line);border-radius:10px;background:#fff;color:var(--sub);font-family:inherit;font-size:13px;cursor:pointer}
.syncitem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.syncitem .si-in{flex:1;min-width:0}
.syncitem .si-nm{font-weight:700;font-size:13.5px}
.syncitem .si-sub{font-size:11px;color:var(--sub);margin-top:2px;font-family:monospace}
.syncitem .si-del{border:none;background:none;color:#c55;cursor:pointer;font-size:12px;font-weight:600;flex:0 0 auto}
.pin-pop{min-width:150px}
.pp-cat{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:2px 10px;border-radius:999px;margin-bottom:6px}
.pp-embed{width:100%;height:220px;border:0;border-radius:10px;margin:4px 0 8px;background:#eef0f2;display:block}
.pp-name{font-weight:700;font-size:14px;margin-bottom:3px;color:var(--ink);line-height:1.3}
.pp-memo{font-size:12px;color:var(--sub);margin-bottom:4px;line-height:1.5;max-height:64px;overflow:auto}
.pp-btns{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.pp-btns button{border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;color:#fff}
.pp-nv{background:#03c75a}
.pp-gg{background:#4285f4}
.pp-ed{background:#7a8089}
.pp-sv{background:#e8912a}
.pp-live{font-size:11.5px;color:#8a8f98;text-align:center;padding:4px}
.leaflet-popup-content{margin:12px 14px}

/* ═══ 촬영지 탭 (260911) — 드라마·영화가 실제로 찍힌 자리 ═══
   출처: 한국문화정보원 미디어콘텐츠 영상 촬영지 데이터(공공데이터포털, 이용허락범위 제한 없음) */
.sc-filters{position:fixed;top:108px;left:0;right:0;z-index:645;background:#fff;border-bottom:1px solid var(--line,#e8e2d5);
  padding:8px 12px 7px;display:none;max-height:56vh;overflow-y:auto}
body.my-on .sc-filters{display:block}
body.my-on #map{top:var(--mtop,176px) !important}
body.my-on .search-box{display:none !important}
.mf-detail{display:none;margin-top:7px;padding-top:8px;border-top:1px dashed var(--line,#e8e2d5)}
.mf-detail.on{display:block}
.sc-chip.src{font-size:12.5px;padding:7px 13px}
.sc-chip.src.on{border-color:#4a4f57;background:#4a4f57;color:#fff}
.sc-chip.src.mine.on{border-color:var(--clover,#4c8c4a);background:var(--clover,#4c8c4a);color:#fff}
.sc-rowlabel{display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:10.5px;font-weight:800;color:#a8a49a;padding:7px 2px 4px;letter-spacing:.2px}
.sc-allbtn{flex:0 0 auto;border:1px solid var(--line,#e8e2d5);background:#fff;border-radius:7px;
  font-size:10px;font-weight:800;color:#8a9089;cursor:pointer;padding:3px 8px;font-family:inherit}
.sc-allbtn:active{background:#f1efe8}
.mf-detail .sc-row{flex-wrap:wrap;overflow:visible;padding-bottom:2px}   /* 펼쳤을 땐 줄바꿈해서 다 보이게 */
.sc-chip.preset{border-color:#c9a227;background:#fdf8e8;color:#8a6d12;font-weight:800}
.sc-chip.preset:active{background:#f6ecd0}
.sc-chip.reset{border-color:var(--line,#e8e2d5);background:#fff;color:#9a9384}
#btnDetail .n{background:#e0663c;color:#fff;border-radius:999px;padding:1px 6px;margin-left:5px;font-size:10px;opacity:1}
.sc-srch{width:100%;box-sizing:border-box;border:1px solid var(--line,#e8e2d5);border-radius:9px;padding:8px 11px;
  font-size:13px;font-family:inherit;color:var(--ink,#2c332e);margin-bottom:7px}
.sc-row{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sc-row::-webkit-scrollbar{display:none}
.sc-chip{flex:0 0 auto;padding:6px 11px;border:1.5px solid var(--line,#e8e2d5);border-radius:999px;background:#fff;
  color:var(--sub,#7d7566);font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.sc-chip.on{border-color:var(--clover,#4c8c4a);background:#eef4ec;color:#357a51}
.sc-chip .n{font-weight:600;opacity:.6;margin-left:3px;font-size:10.5px}
.sc-chip.pre{border-color:#c9a227;background:#fdf8e8;color:#8a6d12}
.sc-chip.pre.on{border-color:var(--clover,#4c8c4a);background:var(--clover,#4c8c4a);color:#fff}
.sc-stat{font-size:11px;color:var(--sub,#7d7566);font-weight:650;padding-top:5px}
.sc-stat b{color:#357a51}
/* 촬영지 핀은 네모(필름 프레임) — 내 저장장소(동그라미)와 모양으로 구분 */
.spin{width:23px;height:17px;background:#4a4f57;border:1.5px solid #fff;border-radius:3px;
  box-shadow:0 2px 5px rgba(0,0,0,.32);position:relative;display:grid;place-items:center}
.spin:before,.spin:after{content:'';position:absolute;top:2px;bottom:2px;width:2.5px;
  background:repeating-linear-gradient(#fff 0 2px,transparent 2px 4px)}
.spin:before{left:1.5px} .spin:after{right:1.5px}
.spin b{font-size:8.5px;color:#fff;font-weight:800;line-height:1}
.spin.multi{background:#8a4b2a}
/* 추천지 핀은 마름모 — 동그라미(내 장소)·네모(촬영지)와 모양으로 구분한다 */
.sppin{width:15px;height:15px;background:#c98a2e;border:1.5px solid #fff;transform:rotate(45deg);
  box-shadow:0 2px 5px rgba(0,0,0,.3);border-radius:3px}
.sppin.fam{background:#b5651d;width:17px;height:17px}
.sp-kind{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:#f6ecd5;color:#8a6d12}
.sp-type{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:#eceef0;color:#5a6169}
.sp-name{font-size:15px;font-weight:800;margin:7px 0 3px;line-height:1.3}
.sp-addr{font-size:11.5px;color:var(--sub,#7d7566);line-height:1.45}
.sp-hours{font-size:11px;color:#8a6d12;background:#fdf8e8;border-radius:7px;padding:5px 8px;margin-top:7px}
.sp-works{margin-top:9px;border-top:1px solid var(--line,#e8e2d5);padding-top:8px;max-height:178px;overflow-y:auto}
.sp-w{padding:6px 0;border-bottom:1px dashed #eee}
.sp-w:last-child{border-bottom:none}
.sp-w b{display:block;font-size:12.5px;font-weight:750;margin-bottom:2px}
.sp-w span{display:block;font-size:11.5px;color:var(--sub,#7d7566);line-height:1.5}
.sp-more{font-size:11px;color:#357a51;font-weight:700;padding-top:5px}
.sp-btns{display:flex;flex-direction:row;gap:4px;margin-top:10px}
.sp-btns button{flex:1 1 0;min-width:0;border:none;border-radius:8px;padding:9px 2px;font-size:11px;font-weight:750;
  font-family:inherit;cursor:pointer;color:#fff;white-space:nowrap}
.sp-btns .sb-nv{background:#03c75a} .sp-btns .sb-gg{background:#4285f4} .sp-btns .sb-kp{background:#4c8c4a}

<script>
/* 한 번 받은 데이터를 기기에 두고 쓴다 (260913 — "열 때마다 다운받으면 무겁다")
   촬영지 4.2MB·추천지 4.9MB·도시사진 2.4MB를 여행지에서 다시 받지 않게 한다. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* 안 되면 그냥 평소대로 */ });
  });
  // 자료가 바뀌면 알려주고, 누르면 바로 최신으로 다시 연다
  navigator.serviceWorker.addEventListener('message', function(ev){
    if(!ev.data || ev.data.type!=='maydly-data-updated') return;
    var el=document.getElementById('dataUpdated');
    if(!el){
      el=document.createElement('div'); el.id='dataUpdated';
      el.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:1300;'
        +'background:#2c332e;color:#fff;font-size:12.5px;padding:10px 14px;border-radius:999px;'
        +'box-shadow:0 4px 16px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;'
        +'font-family:inherit;max-width:90vw';
      el.innerHTML='<span>새 자료가 있습니다</span>'
        +'<button style="border:none;border-radius:999px;background:#7fb877;color:#1d2a1f;'
        +'font-weight:800;font-size:12px;padding:6px 12px;cursor:pointer;font-family:inherit">지금 받기</button>';
      el.querySelector('button').onclick=function(){ location.reload(); };
      document.body.appendChild(el);
    }
  });
}
</script>

<script>
/* ===== 통합 여행지도: 국내 ↔ 일본 탭 전환 ===== */
var map = L.map('map',{zoomControl:true,attributionControl:true}).setView([36.4,127.9],7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, minZoom:2, attribution:'© OpenStreetMap'
}).addTo(map);

var MARKERS = [];
var JP_LOADED = false;
var VIEW = { kr:{c:[36.4,127.9], z:7}, jp:{c:[37.6,137.2], z:5}, tv:{c:[36.6,133.0], z:5} };
var PH = { kr:'🔍 도시 검색 (예: 경주 · 여수 · 강릉 · 남해)', jp:'🔍 도시 검색 (예: 이마바리 · 고치 · 나루토)', tv:'🔍 도시 검색 (국내·일본 · 예: 경주 · 오타루)' };

function drawMarkers(){
  MARKERS.forEach(function(m){ map.removeLayer(m); }); MARKERS = [];
  (window.ORDER || Object.keys(CITY)).forEach(function(k){
    var pos = COORDS[k], c = CITY[k]; if(!pos||!c) return;
    var icon = L.divIcon({className:'', html:'<div class="lp"><div class="dot"><b>🍀</b></div><div class="lab">'+(c.nm||k)+'</div></div>', iconSize:[0,0], iconAnchor:[0,0]});
    var m = L.marker(pos,{icon:icon}).addTo(map).on('click', (function(kk){
      return function(){ ensureJPDetail(kk, function(){ showPreview(kk); }); };
    })(k));
    MARKERS.push(m);
  });
}
var _searchReady = false;

/* 국내·일본을 한 지도에 (260912 명진 요청 — 탭을 오가지 않게) */
function mergeCities(){
  var c={}, o={};
  Object.keys(window.CITY_JP||{}).forEach(function(k){ c[k]=window.CITY_JP[k]; o[k]=(window.COORDS_JP||{})[k]; });
  Object.keys(window.CITY_KR||{}).forEach(function(k){ c[k]=window.CITY_KR[k]; o[k]=(window.COORDS_KR||{})[k]; });
  window.CITY=c; window.COORDS=o; window.ORDER=null;
}
function activateTravel(){
  myOff();
  if(window.hidePreview) hidePreview(); if(window.closeDetail) closeDetail();
  window.COUNTRY='tv';
  setFab('travel');            // 신의눈 링크만 남긴다(260912 — 여기가 빠져 초기 진입 때 안 보였다)
  mergeCities();
  drawMarkers();
  if(!_searchReady){ try{ setupSearch(map); }catch(e){} _searchReady=true; }
  map.setView(VIEW.tv.c, VIEW.tv.z);
  document.querySelectorAll('.ctab').forEach(function(t){ t.classList.toggle('on', t.getAttribute('data-c')==='tv'); });
  document.getElementById('citySearch').placeholder = PH.tv;
  setFab('travel');
  var lb=document.getElementById('locbtn'); if(lb) lb.classList.remove('on');
  if(window.renderMyPlaces) renderMyPlaces();
  if(!JP_LOADED){                       // 일본은 무거우므로 국내를 먼저 보여주고 뒤에서 채운다
    loadJP(function(){ if(window.COUNTRY==='tv'){ mergeCities(); drawMarkers(); } });
  }
}

function activate(cc){
  myOff();
  window.CITY   = (cc==='jp') ? window.CITY_JP   : window.CITY_KR;
  window.COORDS = (cc==='jp') ? window.COORDS_JP : window.COORDS_KR;
  window.ORDER  = (cc==='jp') ? window.ORDER_JP  : null;
  drawMarkers();
  if(!_searchReady){ try{ setupSearch(map); }catch(e){} _searchReady = true; }  // 검색은 1회만, window.CITY 참조로 활성국가 반영
  map.setView(VIEW[cc].c, VIEW[cc].z);
  document.querySelectorAll('.ctab').forEach(function(t){ t.classList.toggle('on', t.getAttribute('data-c')===cc); });
  document.getElementById('citySearch').placeholder = PH[cc];
  document.getElementById('creditLink').href = (cc==='kr') ? '../travel-kr/사진출처.html' : '사진출처.html';
  window.COUNTRY = cc;
  setFab('travel');   // 신의눈만 남기고 내 장소 버튼들은 감춘다
  var lb=document.getElementById('locbtn'); if(lb) lb.classList.remove('on');
  if(window.renderMyPlaces) renderMyPlaces();
}

/* 일본 데이터는 둘로 나눠 받는다 (260913).
   국내·일본을 한 지도로 합치면서 11.32MB를 앱 열 때마다 받게 되어 폰에서 아예 안 켜졌다(명진 지적).
   마커에 필요한 건 city.js+order.js 0.04MB뿐이고, 나머지 11.28MB(사진·가이드)는
   도시를 눌러 상세를 볼 때만 있으면 된다. */
// 마커용 0.65MB — 도시 이름(city)·순서(order)·나머지 783개 도시와 좌표(batch1~6)
var JP_CORE = ['data/city.js','data/order.js',
  'data/batch1.js','data/batch2.js','data/batch3.js','data/batch4.js','data/batch5.js','data/batch6.js'];
// 상세용 10.7MB — 도시 사진(cityimg 2.4MB·tvimg 0.8MB)과 권역 가이드
var JP_REST = ['data/tvimg.js','data/cityimg.js','data/photos.js','data/guides.js',
  'data/guides_시코쿠.js','data/guides_북방.js','data/guides_도호쿠.js','data/guides_주고쿠.js',
  'data/guides_규슈.js','data/guides_간사이.js','data/guides_주부.js','data/guides_간토.js',
  'data/guides_잔여.js'];
var JP_REST_LOADED = false;

function loadScripts(files, done){
  var i = 0;
  (function next(){
    if(i >= files.length){ done(); return; }
    var s = document.createElement('script'); s.src = files[i++] + "?v=3";
    s.onload = next; s.onerror = next; document.head.appendChild(s);
  })();
}

/* 마커용만 — 가볍다(0.04MB) */
function loadJP(done){
  if(JP_LOADED){ done(); return; }
  var ld = document.getElementById('maploading');
  if(ld){ ld.textContent='일본 도시 불러오는 중…'; ld.classList.add('on'); }
  window.CITY = {}; window.COORDS = {};      // 일본 로드 전 비워 일본 것만 담는다
  loadScripts(JP_CORE, function(){
    window.CITY_JP = CITY; window.COORDS_JP = COORDS; window.ORDER_JP = window.ORDER || null;
    JP_LOADED = true;
    if(ld) ld.classList.remove('on');
    done();
  });
}

/* 상세(사진·가이드)는 일본 도시를 처음 누를 때만 — 11.28MB */
function ensureJPDetail(cityKey, done){
  if(JP_REST_LOADED || !(window.CITY_JP && window.CITY_JP[cityKey])){ done(); return; }
  var ld = document.getElementById('maploading');
  if(ld){ ld.textContent='도시 사진·가이드 불러오는 중… (처음 한 번)'; ld.classList.add('on'); }
  var keep = window.CITY, keepC = window.COORDS;
  loadScripts(JP_REST, function(){
    // 상세 파일들이 CITY에 덧붙므로, 합쳐둔 목록을 다시 세운다
    window.CITY_JP = window.CITY; window.COORDS_JP = window.COORDS || keepC;
    JP_REST_LOADED = true;
    if(typeof mergeCities === 'function' && window.COUNTRY === 'tv') mergeCities();
    else { window.CITY = keep; window.COORDS = keepC; }
    if(ld) ld.classList.remove('on');
    done();
  });
}

function renderCountry(cc){
  if(cc==='my'){ activateMy(); }
  else if(cc==='jp'){ loadJP(function(){ activate('jp'); }); }   // 예전 링크 호환
  else { activateTravel(); }
}

/* ═══════════ 촬영지 탭 (260911) ═══════════
   드라마·영화가 실제로 찍힌 자리 8,614곳.
   출처: 한국문화정보원 미디어콘텐츠 영상 촬영지 데이터(공공데이터포털, 이용허락범위 제한 없음)
   데이터가 3.4MB라 탭을 처음 누를 때만 받는다(일본 데이터와 같은 방식). */
var SC_LOADED=false, SC_P=[], SC_CL=null, SC_INIT=false, SC_SHOWN=0, SC_WORKS=0, SC_KR=0, SC_JP=0;
/* 내 지도 = 내 저장장소 + 영화촬영지를 한 지도에서 필터로 보는 화면 (260911 명진 확정).
   탭을 나누면 왔다 갔다 해야 해서, 하나로 합치고 켜고 끄는 방식으로 바꿨다. */
var MY_ST = { mine:true, scene:false, spots:false, cats:{}, detail:false };
var MY_INIT = false;

function myMineList(){ return (window.MYPLACES||[]).concat(window.LIVEPLACES||[]); }
function myMineShown(){ return myMineList().filter(function(p){ return MY_ST.cats[p.cat]!==false; }).length; }

function myStat(){
  var el=document.getElementById('scStat'); if(!el) return;
  var mine = MY_ST.mine ? myMineShown() : 0;
  var h = '📌 내 장소 <b>'+mine.toLocaleString()+'</b>곳';
  if(MY_ST.spots) h += ' · 🏛 추천지 <b>'+SP_SHOWN.toLocaleString()+'</b>곳';
  if(window.TR && TR.on) h += ' · 🛣 다닌 길 <b>'+TR_SHOWN.toLocaleString()+'</b>구간'
    + (TR_CUT? ' <span style="color:#c2557a">／'+TR_ALL.toLocaleString()+'구간 중 일부만 — 확대하면 다 보입니다</span>' : '');
  if(MY_ST.scene || MY_ST.spots || (window.TR && TR.on)) h += ' <span style="opacity:.65">(이 화면)</span>';
  if(MY_ST.scene){
    h += ' · 🎞 촬영지 <b>'+SC_SHOWN.toLocaleString()+'</b>곳'
       + ' <span style="opacity:.7">(🇰🇷'+SC_KR.toLocaleString()+' · 🇯🇵'+SC_JP.toLocaleString()+')</span>'
       + (SC_ST.outdoor? ' <span style="color:#8a6d12">한국은 야외만</span>' : '');
    h += '<div class="sc-credit">촬영지 출처: 한국문화정보원 미디어콘텐츠 영상 촬영지 데이터 · 일본어 위키백과(CC BY-SA)</div>';
  }
  if(MY_ST.spots) h += '<div class="sc-credit">추천지 출처: © OpenStreetMap 기여자 (ODbL)</div>';

/* 필터바 높이가 열고 닫힘에 따라 바뀌므로 지도 시작 위치를 맞춰준다 */
function fitFilterHeight(){
  var f=document.getElementById('myFilters'); if(!f) return;
  var hh=Math.round(f.getBoundingClientRect().height);
  document.documentElement.style.setProperty('--mtop',(108+hh)+'px');
  setTimeout(function(){ map.invalidateSize(); },60);
}

function toggleScene(btn){
  if(MY_ST.scene){
    MY_ST.scene=false; btn.classList.remove('on');
    if(SC_CL && map.hasLayer(SC_CL)) map.removeLayer(SC_CL);
    myStat(); fitFilterHeight(); refreshTiles(); return;
  }
  MY_ST.scene=true; btn.classList.add('on');
  if(!SC_CL){
    SC_CL=L.markerClusterGroup({ chunkedLoading:true, maxClusterRadius:52, spiderfyOnMaxZoom:true,
      disableClusteringAtZoom:17, showCoverageOnHover:false });
  }
  if(!map.hasLayer(SC_CL)) map.addLayer(SC_CL);
  if(!SC_INIT){ scChips(); SC_INIT=true; }
  refreshTiles(); fitFilterHeight();
}

/* ───── 필터 조작 편의 (260912 명진 요청) ─────
   칩을 등록해두고 상태를 한 곳에서 되비춘다. 그래야 「모두」·프리셋으로 여러 칩을
   한꺼번에 바꿔도 화면이 어긋나지 않는다. */
var CHIPS=[];
/* ───── 신의눈(God's Eye View) 연결 ─────
   신의눈은 명진 맥에서만 도는 프로그램(localhost)이라 공개 사이트에 버튼을 늘 띄우면
   다른 사람에겐 열리지 않는다. 그래서 명진이 켤 때만 버튼이 생기고, 그 선택은 이 기기에만 남는다. */
var GEV_URL='https://maydly.github.io/gev/';
/* 지금 지도에서 보고 있는 것과 같은 레이어를 3D에서도 켜준다
   (촬영지=1, 내 장소=p — 신의눈 쪽 레이어 토큰) */
function gevLayers(){
  var l=[];
  if(MY_ST.scene) l.push('1');
  if(MY_ST.mine) l.push('p');
  return l.length? l.join('.') : 'p';
}
/* 그 자리를 신의눈 3D 지구본에서 여는 주소.
   window.open()은 팝업 차단에 걸려 아예 열리지 않았다(260912 명진). 그래서 진짜 링크(a 태그)로 바꿨다. */
function gevHref(lat,lng,alt){
  return GEV_URL+'#v=2&l='+gevLayers()+'&lat='+(+lat).toFixed(5)+'&lon='+(+lng).toFixed(5)
       + '&alt='+(alt||1200)+'&heading=0&pitch=-35';
}
/* 지금 화면 그대로 — 줌 단계를 고도로 바꿔 넘긴다 */
function gevHereHref(){
  var c=map.getCenter(), z=map.getZoom();
  var alt=Math.max(600, Math.min(Math.round(40000000/Math.pow(2,z)), 12000000));
  return gevHref(c.lat, c.lng, alt);
}
/* 오른쪽 아래 신의눈 링크는 지도를 움직일 때마다 목적지를 갱신한다 */
function gevSyncFab(){
  var a=document.getElementById('gevFab');
  if(a) a.href=gevHereHref();
}
function gevBtn(lat,lng){
  return '<a class="sb-gev" href="'+gevHref(lat,lng,1200)+'" target="_blank" rel="noopener">🌍 3D</a>';
}
function chipGet(g,k){
  if(g==='cat')     return MY_ST.cats[k]!==false;
  if(g==='country') return !!SC_ST.country[k];
  if(g==='jsrc')    return !!SC_ST.jsrc[k];
  if(g==='media')   return !!SC_ST.media[k];
  if(g==='type')    return !!SC_ST.type[k];
  if(g==='outdoor') return !!SC_ST.outdoor;
  if(g==='mine')    return !!MY_ST.mine;
  if(g==='scene')   return !!MY_ST.scene;
  if(g==='spotsrc') return !!MY_ST.spots;
  if(g==='spkind')  return !!SP_ST.kind[k];
  if(g==='spfam')   return !!SP_ST.famousOnly;
  return true;
}
function chipSet(g,k,v){
  if(g==='cat') MY_ST.cats[k]=v;
  else if(g==='country') SC_ST.country[k]=v;
  else if(g==='jsrc') SC_ST.jsrc[k]=v;
  else if(g==='media') SC_ST.media[k]=v;
  else if(g==='type') SC_ST.type[k]=v;
  else if(g==='outdoor') SC_ST.outdoor=v;
  else if(g==='mine') MY_ST.mine=v;
  else if(g==='spkind') SP_ST.kind[k]=v;
  else if(g==='spfam') SP_ST.famousOnly=v;
}
function syncChips(){
  var off=0;
  CHIPS.forEach(function(c){
    var on=chipGet(c.g,c.k);
    c.el.classList.toggle('on', on);
    if(!on && c.g!=='scene') off++;
  });
  var bd=document.getElementById('btnDetail');
  if(bd) bd.innerHTML='⚙︎ 필터'+(off? '<span class="n">'+off+'</span>':'');
}
/* 필터를 바꾼 뒤 지도·통계·칩을 한 번에 맞춘다 */
function applyFilters(){
  renderMyPlaces();
  if(MY_ST.spots) spRender();
  if(MY_ST.scene) scRender();
  myStat();
  syncChips();
}
/* 촬영지 레이어를 켜고 이어서 한다 (프리셋에서 부른다)
   ⚠️ 260913: 예전엔 여기서 loadScenes()로 4MB를 통째로 받았다. 격자 방식으로 바꾼 뒤에도
   이 경로가 남아 프리셋을 누르면 전국 자료를 다시 받았다. 이제 켜기만 하고,
   보이는 곳의 자료는 refreshTiles()가 격자에서 가져온다. */
function needScene(after){
  if(MY_ST.scene){ after(); return; }
  var btn=document.querySelector('#myRow0 .sc-chip.src:not(.mine)');
  MY_ST.scene=true;
  if(!SC_CL) SC_CL=L.markerClusterGroup({ chunkedLoading:true, maxClusterRadius:52,
    spiderfyOnMaxZoom:true, disableClusteringAtZoom:17, showCoverageOnHover:false });
  if(!map.hasLayer(SC_CL)) map.addLayer(SC_CL);
  if(!SC_INIT){ scChips(); SC_INIT=true; }
  if(btn) btn.classList.add('on');
  after(); fitFilterHeight();
}
function setGroup(g, keys, v){ keys.forEach(function(k){ chipSet(g,k,v); }); }
function allKeys(g){
  if(g==='cat') return Object.keys(CATS);
  if(g==='country') return ['kr','jp'];
  if(g==='jsrc') return ['loc','anime','miki'];
  if(g==='media') return Object.keys(SC_MEDIA);
  if(g==='type') return Object.keys(SC_TYPE);
  if(g==='spkind') return Object.keys(SP_KIND);
  return [];
}

/* 오른쪽 아래 버튼 묶음 — 신의눈은 모든 탭에서, 나머지는 '내 지도' 탭에서만 (260912) */
function setFab(mode){
  var fab=document.querySelector('.myfab'); if(!fab) return;
  fab.style.display='flex';
  var bs=fab.querySelectorAll('button');
  for(var i=0;i<bs.length;i++){
    var always=bs[i].classList.contains('mf-gev');
    bs[i].style.display=(mode==='my'||always)? '':'none';
  }

function mkChip(rowId,label,cnt,g,k,cls){
  var b=document.createElement('button');
  b.className='sc-chip'+(cls? ' '+cls:'');
  b.innerHTML=label+(cnt!=null? '<span class="n">'+cnt.toLocaleString()+'</span>':'');
  b.onclick=function(){ chipSet(g,k,!chipGet(g,k)); applyFilters(); };
  document.getElementById(rowId).appendChild(b);
  CHIPS.push({el:b,g:g,k:k});
  return b;
}
/* 줄 제목 + 그 줄 전체를 켜고 끄는 「모두」 버튼 */
function mkLabel(rowId,text,g){
  var row=document.getElementById(rowId);
  var lab=document.createElement('div'); lab.className='sc-rowlabel';
  var sp=document.createElement('span'); sp.textContent=text; lab.appendChild(sp);
  if(g){
    var btn=document.createElement('button'); btn.className='sc-allbtn'; btn.textContent='모두';
    btn.onclick=function(){
      var keys=allKeys(g), allOn=keys.every(function(k){ return chipGet(g,k); });
      setGroup(g, keys, !allOn); applyFilters();
    };
    lab.appendChild(btn);
  }
  row.parentNode.insertBefore(lab,row);
}

function myChips(){
  Object.keys(CATS).forEach(function(k){ if(MY_ST.cats[k]===undefined) MY_ST.cats[k]=true; });

function loadScenes(cb){
  if(SC_LOADED){ cb(); return; }
  var ld=document.getElementById('maploading');
  if(ld){ ld.textContent='촬영지 불러오는 중…'; ld.classList.add('on'); }
  ['https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css',
   'https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css'].forEach(function(h){
    var l=document.createElement('link'); l.rel='stylesheet'; l.href=h; document.head.appendChild(l);
  });
  var files=['https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js',
             'data/scenes_kr.js?v=1','data/scenes_jp.js?v=1'];
  var i=0;
  (function next(){
    if(i>=files.length){
      var kr=(window.KR_SCENES||[]).map(function(x){ x.c='kr'; return x; });
      var jp=(window.JP_SCENES||[]).map(function(x){ x.c='jp'; return x; });

      SC_LOADED=true;
      if(ld) ld.classList.remove('on');

    s.onload=next; s.onerror=next; document.head.appendChild(s);
  })();
}

/* ═══════════ 보이는 곳만 받는 격자 방식 (260913) ═══════════
   명진 지적: "구글이나 네이버는 왜 안 느린데? 만들고 구동하는 방식의 문제 같은데" — 맞았다.
   전국 59,561곳(9.1MB)을 통째로 받아 들고 있던 것을 0.1도(약 11km) 격자로 쪼개고,
   화면에 걸린 격자 파일만 받는다. 지도 이미지 타일과 같은 원리다. */
var TILE={ scale:10, cells:null, got:{}, data:{}, pend:0 };
var TILE_MIN_ZOOM=11;          // 이보다 줌아웃하면 표시하지 않는다(구글맵도 그렇게 한다)

function tileIndex(cb){
  if(TILE.cells){ cb(); return; }
  fetch('data/tiles/index.json?v=1').then(function(r){ return r.json(); })
    .then(function(j){ TILE.scale=j.scale||10; TILE.cells=j.cells||{}; cb(); })
    .catch(function(){ TILE.cells={}; cb(); });
}
function visibleTileKeys(){
  var b=map.getBounds(), s=TILE.scale;
  var y0=Math.floor(b.getSouth()*s), y1=Math.floor(b.getNorth()*s);
  var x0=Math.floor(b.getWest()*s), x1=Math.floor(b.getEast()*s);
  if((y1-y0+1)*(x1-x0+1) > 600) return null;          // 화면이 너무 넓다
  var out=[];
  for(var y=y0;y<=y1;y++) for(var x=x0;x<=x1;x++){
    var k=y+'_'+x;
    if(TILE.cells[k]) out.push(k);
  }
  return out;
}
function ensureTiles(keys, cb){
  var need=[];
  for(var i=0;i<keys.length;i++) if(!TILE.got[keys[i]]) need.push(keys[i]);
  if(!need.length){ cb(); return; }
  var ld=document.getElementById('maploading');
  if(ld && need.length>2){ ld.textContent='이 지역 자료 불러오는 중…'; ld.classList.add('on'); }
  var left=need.length;
  need.forEach(function(k){
    TILE.got[k]='loading';
    fetch('data/tiles/'+k+'.json?v=1')
      .then(function(r){ return r.json(); })
      .then(function(rows){ TILE.data[k]=rows||[]; })
      .catch(function(){ TILE.data[k]=[]; })
      .then(function(){
        TILE.got[k]=true;
        if(--left===0){ if(ld) ld.classList.remove('on'); cb(); }
      });
  });
}
function tileRows(keys){
  var out=[];
  for(var i=0;i<keys.length;i++){ var d=TILE.data[keys[i]]; if(d && d.length) out=out.concat(d); }
  return out;
}
function zoomHint(on){
  var el=document.getElementById('zoomHint');
  if(!el){
    el=document.createElement('div'); el.id='zoomHint';
    el.style.cssText='position:fixed;left:50%;top:var(--mtop,180px);transform:translateX(-50%);z-index:660;'
      +'background:rgba(44,51,46,.92);color:#fff;font-size:12px;padding:7px 14px;border-radius:999px;'
      +'box-shadow:0 3px 12px rgba(0,0,0,.25);white-space:nowrap;display:none;font-family:inherit';
    el.textContent='지도를 확대하면 촬영지·추천지가 보입니다';
    document.body.appendChild(el);
  }
  el.style.display=on? 'block':'none';
}
/* 지도를 움직이거나 줌을 바꿀 때마다 — 보이는 격자만 받아 그린다 */
function refreshTiles(){
  if(window.COUNTRY!=='my' || !(MY_ST.scene || MY_ST.spots)){
    zoomHint(false);
    if(SC_CL) SC_CL.clearLayers();
    if(SP_CL) SP_CL.clearLayers();
    return;
  }
  if(map.getZoom() < TILE_MIN_ZOOM){
    zoomHint(true);
    if(SC_CL) SC_CL.clearLayers();
    if(SP_CL) SP_CL.clearLayers();
    SC_SHOWN=0; SP_SHOWN=0; myStat();
    return;
  }
  zoomHint(false);
  tileIndex(function(){
    var keys=visibleTileKeys();
    if(!keys){ zoomHint(true); return; }
    ensureTiles(keys, function(){
      var rows=tileRows(keys);
      SC_P=[]; SP_P=[];
      for(var i=0;i<rows.length;i++){
        var r=rows[i];
        if(r.k==='sc') SC_P.push(r);
        else if(r.k==='sp'){
          SP_P.push({ n:r.n, o:r.o, la:r.la, ln:r.ln, c:r.c, k:r.sk||'see', f:r.f||0 });
        }
      }
      if(MY_ST.scene) scRender();
      if(MY_ST.spots) spRender();
      myStat();
    });
  });
}

function scPopWidth(){ return Math.max(210, Math.min(300, (window.innerWidth||360) - 76)); }
function scEsc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function scWorks(p){
  var q=SC_ST.q;
  return p.w.filter(function(w){
    if(w.m!=='jp' && !SC_ST.media[w.m]) return false;   // 일본은 매체 구분이 없다 → 나라 칩으로 제어
    if(q && (p.n+' '+w.ti).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function scPass(p){
  if(!SC_ST.country[p.c||'kr']) return null;
  if((p.c||'kr')==='jp' && !SC_ST.jsrc[p.s||'loc']) return null;
  if((p.c||'kr')!=='jp'){          // 장소 종류·야외 필터는 한국 데이터에만 있다
    var t=SC_TYPE[p.t]? p.t : 'etc';
    if(!SC_ST.type[t]) return null;
    if(SC_ST.outdoor && !SC_TYPE[t].out) return null;
  }
  var w=scWorks(p);
  return w.length? w : null;
}

function scPopup(idx, works){
  var p=SC_P[idx], jp=(p.c==='jp');
  var t=jp? {l:'🇯🇵 '+((JSRC[p.s]||JSRC.loc).l)} : (SC_TYPE[p.t]||SC_TYPE.etc);
  var h='<span class="sp-type">'+scEsc(t.l)+'</span>'
      + '<div class="sp-name">'+scEsc(p.n)+'</div>'
      + (jp && p.jn? '<div class="sp-addr">'+scEsc(p.jn)+'</div>' : (p.a? '<div class="sp-addr">'+scEsc(p.a)+'</div>':''));
  if(p.h) h+='<div class="sp-hours">🕒 '+scEsc(p.h)+'</div>';
  h+='<div class="sp-works">';
  works.slice(0,6).forEach(function(w){
    var m=SC_MEDIA[w.m]||{e:'🎞'};
    h+='<div class="sp-w"><b>'+m.e+' '+scEsc(w.ti)+'</b>'
     + (w.jt? '<span>'+scEsc(w.jt)+'</span>' : '')
     + (w.d? '<span>'+scEsc(w.d)+'</span>':'')+'</div>';
  });
  h+='</div>';
  if(works.length>6) h+='<div class="sp-more">외 '+(works.length-6)+'편이 이곳에서 촬영됐습니다</div>';
  h+='<div class="sp-btns">'
   + (jp? '' : '<button class="sb-nv" onclick="scNv('+idx+')">네이버지도</button>')
   + '<button class="sb-gg" onclick="scGg('+idx+')">구글맵</button>'
   + (jp && p.u? '<button class="sb-wk" onclick="scWiki('+idx+')">위키백과</button>' : '')
   + gevBtn(p.la,p.ln)
   + '<button class="sb-rt" onclick="scRoute('+idx+')">🧭 길찾기</button>'
   + '<button class="sb-kp" onclick="scKeep('+idx+')">📌 내 장소로</button>'
   + '</div>';
  if(jp) h+='<div class="sc-credit" style="text-align:left;padding-top:7px">출처: 일본어 위키백과 (CC BY-SA 4.0)</div>';
  return h;
}

/* ── 내 위치 (260911) ──
   검색(OSM)은 작은 가게를 잘 못 찾는다. 실제로는 그 자리에 서서 저장하는 일이 많으므로
   현재 위치를 지도에 띄우고 거기서 바로 저장하는 길을 기본 수단으로 둔다. */
var _meMarker=null, _meCircle=null, _meLL=null;
function goMyLocation(cb){
  var btn=document.getElementById('locbtn');

  if(btn){ btn.textContent='⏳'; btn.disabled=true; }
  navigator.geolocation.getCurrentPosition(function(pos){
    if(btn){ btn.textContent='📍'; btn.disabled=false; }

    var acc=Math.round(pos.coords.accuracy||50);
    if(_meMarker){ map.removeLayer(_meMarker); _meMarker=null; }

    _meCircle=L.circle([_meLL.lat,_meLL.lng],{radius:acc,color:'#2f7fd6',weight:1,fillColor:'#2f7fd6',fillOpacity:.12}).addTo(map);
    _meMarker=L.marker([_meLL.lat,_meLL.lng],{icon:L.divIcon({className:'',html:'<div class="medot"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);
    _meMarker.bindPopup('<div class="mepop"><b>내 위치</b><span class="meacc">오차 약 '+acc+'m</span>'
      +'<button type="button" onclick="saveHere()">여기 저장</button></div>');
    map.setView([_meLL.lat,_meLL.lng], Math.max(map.getZoom(),16));
    if(cb) cb(); else _meMarker.openPopup();
  }, function(err){

      ? '위치 권한이 거부돼 있어요.\n주소창 왼쪽 자물쇠 → 위치 → 허용으로 바꾼 뒤 다시 눌러주세요.'
      : '위치를 가져오지 못했어요. 실외에서 잠시 뒤 다시 시도해주세요.');
  }, {enableHighAccuracy:true, timeout:12000, maximumAge:30000});
}
/* ═══════════ 내가 다닌 길 (260913 명진 요청) ═══════════
   구글 타임라인 기록에서 뽑은 **실제로 지나간 길**. 교통수단이 자료에 적혀 있어
   버스·지하철·기차를 색으로 갈라 그린다. 내 자료라 열쇠도 서버도 필요 없다.
   자료는 `11_이동경로/내가다닌길_타임라인_추출도구.py`로 만든다.

   격자와 같은 방침: **보이는 구간만 그린다.** 2,900개를 한꺼번에 그리면 폰이 버티지 못한다. */
var TR={ on:false, data:null, layer:null, loading:false };
var TR_KIND={
  car:   {c:'#6b7280', l:'🚗 자동차'},
  walk:  {c:'#22a06b', l:'🚶 도보'},
  bike:  {c:'#d08700', l:'🚲 자전거'},
  bus:   {c:'#2f7fd6', l:'🚌 버스'},
  subway:{c:'#7c3aed', l:'🚇 지하철'},
  train: {c:'#dc2626', l:'🚆 기차'},
  ferry: {c:'#0891b2', l:'⛴ 배'},
  fly:   {c:'#94a3b8', l:'✈️ 비행기'}
};
var TR_MAX=900;   // 한 화면에 그릴 구간 수 상한 — 넘으면 "확대하세요"

/* 자료를 **저장소에 올리지 않는다**(260913 명진 확정).
   2년치 이동기록이라 공개 저장소에 두면 생활 반경·일터·다니는 시간대가 그대로 드러난다.
   대신 기기 안(IndexedDB)에만 둔다. 한 번 불러오면 그 기기에서는 계속 보인다.

   note(여행지도)와 gev(신의눈)는 주소가 둘 다 maydly.github.io라 **같은 곳간을 쓴다.**
   그래서 한쪽에서 한 번 불러오면 신의눈에서도 바로 보인다. */
var TRDB={ name:'maydly', store:'blobs', key:'trips' };
function trDB(){
  return new Promise(function(ok,no){
    var q=indexedDB.open(TRDB.name, 1);
    q.onupgradeneeded=function(){ q.result.createObjectStore(TRDB.store); };
    q.onsuccess=function(){ ok(q.result); };
    q.onerror=function(){ no(q.error); };
  });
}
function trGet(){
  return trDB().then(function(db){
    return new Promise(function(ok){
      var r=db.transaction(TRDB.store,'readonly').objectStore(TRDB.store).get(TRDB.key);
      r.onsuccess=function(){ ok(r.result||null); };
      r.onerror=function(){ ok(null); };
    });
  }).catch(function(){ return null; });
}
function trPut(v){
  return trDB().then(function(db){
    return new Promise(function(ok,no){
      var t=db.transaction(TRDB.store,'readwrite');
      t.objectStore(TRDB.store).put(v, TRDB.key);
      t.oncomplete=function(){ ok(true); };
      t.onerror=function(){ no(t.error); };
    });
  });
}
function trUse(d){
  TR.data=(d && d.segments)||[];
  // 구간마다 둘레상자를 미리 재 둔다 — 지도를 움직일 때마다 다시 세지 않게
  TR.data.forEach(function(s){
    var la1=90,la2=-90,ln1=180,ln2=-180;
    for(var i=0;i<s.p.length;i++){
      var p=s.p[i];
      if(p[0]<la1)la1=p[0]; if(p[0]>la2)la2=p[0];
      if(p[1]<ln1)ln1=p[1]; if(p[1]>ln2)ln2=p[1];
    }
    s.bb=[la1,ln1,la2,ln2];
  });
  refreshTrips(); fitFilterHeight();
}
function trPick(){
  var inp=document.getElementById('trFile');
  inp.onchange=function(){
    var f=inp.files && inp.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      var d;
      try { d=JSON.parse(fr.result); } catch(e){ alert('읽을 수 없는 파일입니다.'); return; }
      if(!d || !d.segments){ alert('「내가 다닌 길」 파일이 아닙니다.\n(내가다닌길_타임라인_추출도구.py 로 만든 파일)'); return; }
      trPut(d).catch(function(){});
      trUse(d);
      alert('불러왔습니다 — 구간 '+(d.segments.length).toLocaleString()+'개.\n'
           +'이 기기에 저장돼 다음부터는 바로 보이고, 신의눈에서도 보입니다.');
    };
    fr.readAsText(f);
    inp.value='';
  };
  inp.click();
}

function toggleTrips(btn){

  }
  TR.on=true; btn.classList.add('on');

    // 이 기기에 아직 없다 — 파일에서 한 번 불러오면 그 뒤로는 바로 보인다
    if(confirm('이 기기에 「다닌 길」 자료가 아직 없습니다.\n\n'
             + '개인 이동기록이라 인터넷에 올리지 않고 기기에만 둡니다.\n'
             + '파일을 한 번 불러오면 다음부터는 바로 보이고, 신의눈에서도 보입니다.\n\n'
             + '지금 파일을 고를까요?')){

    } else {
      TR.on=false; btn.classList.remove('on');

}
function refreshTrips(){
  /* 지도 초기화 때 moveend가 먼저 튈 수 있어 TR이 아직 없을 수 있다 */
  if(!window.TR || !TR.on || !TR.data || !TR.layer) return;
  TR.layer.clearLayers();
  var b=map.getBounds(), s=b.getSouth(), n=b.getNorth(), w=b.getWest(), e=b.getEast();
  var 보임=[], k;
  for(var i=0;i<TR.data.length;i++){
    var g=TR.data[i], bb=g.bb;
    if(bb[2]<s || bb[0]>n || bb[3]<w || bb[1]>e) continue;   // 화면 밖
    보임.push(g);
  }
  /* 너무 많으면 **아무것도 안 그리는 게 아니라** 앞에서부터 잘라서 그리고 그 사실을 알린다.
     처음엔 0구간만 보여줬는데, 그러면 고장인지 많아서인지 알 수가 없다(260913 검증에서 잡음). */
  TR_ALL=보임.length;
  TR_CUT = 보임.length > TR_MAX;
  if(TR_CUT) 보임=보임.slice(0, TR_MAX);
  보임.forEach(function(g){
    k=TR_KIND[g.k]||TR_KIND.car;
    L.polyline(g.p, {color:k.c, weight:(g.k==='walk'?3:4), opacity:.8,
      lineCap:'round', lineJoin:'round'})
      .bindPopup('<div class="pin-pop"><b>'+k.l+'</b><br>'
        +'<span style="color:#6b7280;font-size:12px">'+(g.d||'')+'</span></div>')
      .addTo(TR.layer);
  });
  TR_SHOWN=보임.length;
  myStat();
}
var TR_SHOWN=0, TR_ALL=0, TR_CUT=false;

/* ═══════════ 길찾기 (260913 시작 → 260915 다시 만듦) ═══════════
   명진: "티맵·카카오내비처럼, 네이버지도처럼 쓸 수도 있는데 그건 구현이 되냐?"

   ⚠️ 260913에 내가 「대중교통은 앱 안에서 계산할 수 없다」고 했는데 **틀렸다.**
      네이버·카카오·ODsay 같은 **상용 API만** 보고 단정했다. 열쇠 없이 CORS가 열린
      공개 대중교통 라우팅이 있었고, **한국·일본 둘 다 잘 나온다.**
      같은 이유로 도보 경로도 「안 된다」고 했는데, 서버를 하나만 보고 내린 판단이었다.

   지금 쓰는 것 (둘 다 열쇠 없음 · CORS 열림):
   · 대중교통 = **transitous**(MOTIS). 환승·소요시간·노선명(서울1호선)·행선지까지 준다.
     자료는 **시간표 기준**이고 실시간이 아니다(realTime=false). 화면에도 그렇게 적는다.
   · 자동차·도보·자전거 = **FOSSGIS OSRM**. 갈래마다 서버가 따로 있고 턴바이턴 안내도 준다.
     (project-osrm.org 데모 서버는 무엇을 물어도 자동차 답만 준다 — 그래서 여기로 옮겼다)

   못 하는 것 — 화면에도 적어 둔다. 있는 척하지 않는다:
   · **실시간 교통정보**(막힘·정체) — 티맵의 핵심. 열쇠와 중계 서버가 있어야 한다
   · **버스 도착 몇 분 전** — 국토부·서울시 실시간 API는 열쇠 + 중계 서버가 필요하다
   · **음성 안내·화면 꺼도 계속 주행** — 웹페이지는 화면이 꺼지면 멈춘다. 그건 앱의 몫이다
   → 그래서 네이버지도·티맵·구글맵으로 넘기는 버튼도 함께 둔다. */
var _rtLine=null, _rtLegs=[], _rtTo=null, _rtFrom=null, _rtMode='transit';

var RT_MODE={
  transit:{e:'🚇', l:'🚇 대중교통', c:'#2f7fd6'},
  car:    {e:'🚗', l:'🚗 자동차',   c:'#1f6f8b', osrm:'routed-car'},
  foot:   {e:'🚶', l:'🚶 도보',     c:'#22a06b', osrm:'routed-foot'},
  bike:   {e:'🚲', l:'🚲 자전거',   c:'#d08700', osrm:'routed-bike'}
};
/* 탈것 갈래별 색 — 다닌 길(TR_KIND)과 눈에 익게 맞춰 둔다 */
var RT_LEG={ WALK:'#22a06b', SUBWAY:'#7c3aed', METRO:'#7c3aed', BUS:'#2f7fd6',
  TRAM:'#0891b2', RAIL:'#dc2626', REGIONAL_RAIL:'#dc2626', HIGHSPEED_RAIL:'#dc2626',
  LONG_DISTANCE:'#dc2626', NIGHT_RAIL:'#dc2626', FERRY:'#0891b2', COACH:'#2f7fd6' };
var RT_LEGNAME={ WALK:'도보', SUBWAY:'지하철', METRO:'지하철', BUS:'버스', TRAM:'트램',
  RAIL:'기차', REGIONAL_RAIL:'전철', HIGHSPEED_RAIL:'고속철', LONG_DISTANCE:'기차',
  NIGHT_RAIL:'야간열차', FERRY:'배', COACH:'시외버스' };

function rtClear(){
  if(window.NAV && NAV.on) navStop();
  if(_rtLine){ map.removeLayer(_rtLine); _rtLine=null; }
  _rtLegs.forEach(function(l){ map.removeLayer(l); }); _rtLegs=[];
  _rtTo=null;
  var c=document.getElementById('rtCard'); if(c) c.classList.remove('on');
}
function rtKm(a,b){   // 두 점 사이 직선거리(km) — 경로를 못 받아도 이건 늘 보여준다
  var R=6371, d1=(b.lat-a.lat)*Math.PI/180, d2=(b.lng-a.lng)*Math.PI/180;
  var s=Math.sin(d1/2)*Math.sin(d1/2)
      + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(d2/2)*Math.sin(d2/2);
  return R*2*Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
/* 접힌 좌표열 풀기. transitous는 정밀도 7을 쓴다(5로 풀면 엉뚱한 자리가 나온다) */
function rtPoly(str, prec){
  var f=Math.pow(10, prec||7), out=[], i=0, lat=0, lng=0;
  while(i<str.length){
    for(var k=0;k<2;k++){
      var shift=0, result=0, b;
      do { b=str.charCodeAt(i++)-63; result|=(b&0x1f)<<shift; shift+=5; } while(b>=0x20);
      var dd=(result&1)? ~(result>>1) : (result>>1);
      if(k===0) lat+=dd; else lng+=dd;
    }
    out.push([lat/f, lng/f]);
  }
  return out;
}
function rtMin(s){ return Math.max(1, Math.round(s/60)); }
function rtHm(iso){
  try{ var d=new Date(iso); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
  catch(e){ return ''; }
}

function routeTo(lat,lng,name){
  _rtTo={lat:+lat, lng:+lng, name:name||'목적지'};
  var card=document.getElementById('rtCard');
  document.getElementById('rtTitle').textContent='🧭 '+_rtTo.name+' 까지';
  document.getElementById('rtSum').textContent='출발지를 찾는 중…';
  document.getElementById('rtBtns').innerHTML='';
  document.getElementById('rtNote').textContent='';
  card.classList.add('on');

  function go(from, 설명){ _rtFrom=from; _rtFrom.설명=설명; rtRun(); }
  if(_meLL){ go(_meLL, '내 위치'); return; }
  if(!navigator.geolocation){ go(map.getCenter(), '지도 한가운데'); return; }
  navigator.geolocation.getCurrentPosition(
    function(p){ _meLL={lat:p.coords.latitude, lng:p.coords.longitude}; go(_meLL, '내 위치'); },
    function(){ go(map.getCenter(), '지도 한가운데(위치를 못 잡음)'); },
    {enableHighAccuracy:true, timeout:8000, maximumAge:60000});
}
function rtSetMode(m){ _rtMode=m; rtRun(); }

function rtRun(){
  if(!_rtFrom || !_rtTo) return;
  var from=_rtFrom, to=_rtTo, 직선=rtKm(from,to);
  var sum=document.getElementById('rtSum');
  rtTabs();
  if(_rtLine){ map.removeLayer(_rtLine); _rtLine=null; }
  _rtLegs.forEach(function(l){ map.removeLayer(l); }); _rtLegs=[];
  rtLinks(from, to, 직선);
  navButton();

  if(직선 > 700){
    sum.innerHTML='출발 <b>'+esc(from.설명)+'</b> · 직선 <span class="rt-n">'+Math.round(직선)+'km</span>'
      +'<br><span style="color:#8b9098">너무 멀어 길찾기를 하지 않습니다(비행기 거리).</span>';
    return;
  }
  sum.innerHTML='출발 <b>'+esc(from.설명)+'</b> · 직선 '+직선.toFixed(1)+'km · 경로를 받는 중…';
  if(_rtMode==='transit') rtTransit(from, to, 직선);
  else rtRoad(from, to, 직선);
}
function rtTabs(){
  var h='';
  Object.keys(RT_MODE).forEach(function(m){
    h+='<button class="rt-tab'+(m===_rtMode?' on':'')+'" onclick="rtSetMode(\''+m+'\')">'+RT_MODE[m].l+'</button>';
  });
  document.getElementById('rtTabs').innerHTML=h;
}

/* ── 대중교통 (transitous · 열쇠 없음) ── */
function rtTransit(from, to, 직선){
  var sum=document.getElementById('rtSum');
  var u='https://api.transitous.org/api/v1/plan?fromPlace='+from.lat+','+from.lng
      + '&toPlace='+to.lat+','+to.lng
      + '&time='+encodeURIComponent(new Date().toISOString())
      + '&numItineraries=3';
  fetch(u).then(function(r){ return r.json(); }).then(function(d){
    var its=(d && d.itineraries)||[];
    if(!its.length) throw 0;
    // 걷기만 하는 답은 뒤로 미룬다 — 대중교통을 물었으니 탈것이 있는 쪽이 먼저다
    its.sort(function(a,b){
      var ta=a.legs.some(function(l){return l.mode!=='WALK';}) ? 0:1;
      var tb=b.legs.some(function(l){return l.mode!=='WALK';}) ? 0:1;
      return (ta-tb) || (a.duration-b.duration);
    });
    var it=its[0];
    rtDrawLegs(it.legs, (to.lat>=33 && to.lat<=38.8 && to.lng>=124.5 && to.lng<=130.0));
    var h='출발 <b>'+esc(from.설명)+'</b><br>'
        + '🚇 <span class="rt-n">'+rtMin(it.duration)+'분</span>'
        + ' · 환승 '+(it.transfers||0)+'회 · 직선 '+직선.toFixed(1)+'km'
        + '<div class="rt-legs">';
    var 한국 = (to.lat>=33 && to.lat<=38.8 && to.lng>=124.5 && to.lng<=130.0);
    it.legs.forEach(function(l){
      var mode=l.mode;
      /* 한국 자료(KTDB)는 시내버스를 GTFS에서 TRAM으로 적어 놨다. 그대로 두면
         「트램 472」처럼 나오는데 서울에 트램은 없다 — 472·01B·04는 전부 버스다. */
      if(한국 && mode==='TRAM') mode='BUS';
      var c=RT_LEG[mode]||'#6b7280', nm=RT_LEGNAME[mode]||mode;
      var 노선=l.routeShortName||l.routeLongName||'';
      /* 숫자만 대여섯 자리인 것은 노선 이름이 아니라 내부 번호다(일본 자료에 흔하다) */
      if(/^[0-9]{5,}$/.test(노선)) 노선='';
      var 끝=(l.to&&l.to.name)||'';
      h+='<div class="rt-leg"><i style="background:'+c+'"></i>'
       + '<span class="rt-lm">'+esc(nm)+(노선? ' <b>'+esc(노선)+'</b>':'')+'</span>'
       + '<span class="rt-lt">'+rtMin(l.duration)+'분</span>'
       + (mode!=='WALK'&&끝? '<span class="rt-ld">→ '+esc(끝)+'</span>':'')
       + '</div>';
    });
    h+='</div>';
    if(its.length>1){
      h+='<div class="rt-alt">다른 길: '+its.slice(1,3).map(function(x){
        return rtMin(x.duration)+'분(환승 '+(x.transfers||0)+')'; }).join(' · ')+'</div>';
    }
    sum.innerHTML=h;
    NAV.steps=[]; navButton();
    /* 실시간이 들어오는 자료가 있다 — 일본(도쿄메트로·JR)은 지연이 실제로 온다.
       한국 자료(KTDB)는 시간표뿐이라 realTime이 늘 false다. 그 차이를 그대로 적는다. */
    var 실시간=it.legs.filter(function(l){ return l.realTime; }).length;
    var 지연=0;
    it.legs.forEach(function(l){
      if(l.realTime && l.startTime && l.scheduledStartTime){
        var dd=(new Date(l.startTime)-new Date(l.scheduledStartTime))/60000;
        if(dd>지연) 지연=Math.round(dd);
      }
    });
    document.getElementById('rtNote').innerHTML = 실시간
      ? (지연>0 ? '<span class="rt-delay">실시간 — 지연 '+지연+'분</span> · 나머지는 시간표 기준입니다.'
               : '<span class="rt-ontime">실시간 — 정시 운행</span> · 나머지는 시간표 기준입니다.')
      : '시간표 기준입니다(한국 대중교통은 실시간 자료가 없습니다). 나가기 전 지도 앱으로 한 번 확인하세요.';
  }).catch(function(){
    sum.innerHTML='출발 <b>'+esc(from.설명)+'</b> · 직선 <span class="rt-n">'+직선.toFixed(1)+'km</span>'
      +'<br><span style="color:#8b9098">이 구간의 대중교통 길을 찾지 못했습니다. 아래 지도 앱으로 열어보세요.</span>';
  });
}
function rtDrawLegs(legs, 한국){
  legs.forEach(function(l){
    var g=l.legGeometry && l.legGeometry.points;
    if(!g) return;
    var pts=rtPoly(g, 7);
    if(pts.length<2) return;
    var mode=(한국 && l.mode==='TRAM') ? 'BUS' : l.mode;
    var c=RT_LEG[mode]||'#6b7280';
    var line=L.polyline(pts, {color:c, weight:(mode==='WALK'?3:5), opacity:.85,
      dashArray:(mode==='WALK'?'5,6':null), lineCap:'round'}).addTo(map);
    _rtLegs.push(line);
  });
  if(_rtLegs.length){
    var b=_rtLegs[0].getBounds();
    _rtLegs.forEach(function(l){ b.extend(l.getBounds()); });
    map.fitBounds(b, {padding:[40,150]});
  }
}

/* ── 자동차·도보·자전거 (FOSSGIS OSRM · 열쇠 없음) ── */
function rtRoad(from, to, 직선){
  var sum=document.getElementById('rtSum');
  var prof=RT_MODE[_rtMode].osrm;
  fetch('https://routing.openstreetmap.de/'+prof+'/route/v1/driving/'
        +from.lng+','+from.lat+';'+to.lng+','+to.lat+'?overview=full&geometries=geojson&steps=true')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || d.code!=='Ok' || !d.routes || !d.routes.length) throw 0;
      var r=d.routes[0];
      var pts=r.geometry.coordinates.map(function(c){ return [c[1], c[0]]; });
      _rtLine=L.polyline(pts, {color:RT_MODE[_rtMode].c, weight:5, opacity:.85, lineCap:'round'}).addTo(map);
      map.fitBounds(_rtLine.getBounds(), {padding:[40,150]});
      var steps=(r.legs[0]&&r.legs[0].steps)||[];
      /* 따라가기가 쓸 재료 — 회전 지점 좌표·안내말·구간 거리 */
      NAV.route=pts;
      NAV.steps=steps.map(function(st){
        var loc=(st.maneuver&&st.maneuver.location)||null;
        return { at: loc? [loc[1],loc[0]] : pts[pts.length-1],
                 text: rtStep(st), name:(st.name||'').trim(), dist: st.distance||0 };
      });
      navButton();
      var h='출발 <b>'+esc(from.설명)+'</b><br>'+RT_MODE[_rtMode].e
          + ' <span class="rt-n">'+(r.distance/1000).toFixed(1)+'km · '+rtMin(r.duration)+'분</span>'
          + ' · 직선 '+직선.toFixed(1)+'km';
      if(steps.length){
        h+='<div class="rt-legs">';
        steps.slice(0,6).forEach(function(st){
          var nm=(st.name||'').trim();
          h+='<div class="rt-leg"><i style="background:'+RT_MODE[_rtMode].c+'"></i>'
           + '<span class="rt-lm">'+esc(rtStep(st))+(nm? ' <b>'+esc(nm)+'</b>':'')+'</span>'
           + '<span class="rt-lt">'+(st.distance>=1000? (st.distance/1000).toFixed(1)+'km' : Math.round(st.distance)+'m')+'</span>'
           + '</div>';
        });
        if(steps.length>6) h+='<div class="rt-alt">외 '+(steps.length-6)+'단계</div>';
        h+='</div>';
      }
      sum.innerHTML=h;
      document.getElementById('rtNote').textContent = (_rtMode==='car')
        ? '길 모양과 예상 시간입니다. 실시간 막힘은 반영되지 않습니다 — 운전은 티맵·네이버로 여세요.'
        : '길 모양과 예상 시간입니다(OpenStreetMap 기준).';
    })
    .catch(function(){
      sum.innerHTML='출발 <b>'+esc(from.설명)+'</b> · 직선 <span class="rt-n">'+직선.toFixed(1)+'km</span>'
        +'<br><span style="color:#8b9098">경로를 받지 못했습니다. 아래 지도 앱으로 열어보세요.</span>';
    });
}
/* OSRM 안내말을 우리말로 — 자주 나오는 것만 옮긴다 */
var RT_TURN={ 'turn-left':'좌회전','turn-right':'우회전','turn-slight left':'왼쪽으로','turn-slight right':'오른쪽으로',
  'turn-sharp left':'크게 좌회전','turn-sharp right':'크게 우회전','turn-straight':'직진','turn-uturn':'유턴',
  'depart':'출발','arrive':'도착','merge':'합류','fork':'갈림길','roundabout':'회전교차로','rotary':'로터리',
  'continue':'계속','new name':'계속','on ramp':'진입로','off ramp':'빠져나가기','end of road':'길 끝에서' };
function rtStep(st){
  var m=st.maneuver||{}, key=m.type+(m.modifier? '-'+m.modifier : '');
  return RT_TURN[key] || RT_TURN[m.type] || m.type || '이동';
}

/* ═══════════ 따라가기 (260917) ═══════════
   명진 "티맵·네이버지도처럼 쓸 수 있냐" → 브라우저가 어디까지 되는지 재어 보고 만든 것.
   확인한 것(보안 맥락에서 전부 있음): 음성합성·화면 켜두기·위치 계속추적·진동.

   되는 것: 화면 보면서 걷기·운전할 때 다음 회전을 말로 알려주고, 길을 벗어나면 다시 찾는다.
   안 되는 것: **화면을 끄면 멈춘다.** 웹페이지는 뒤에서 계속 돌 수 없다. 그건 앱의 몫이다.
   그래서 화면을 켜 두는 wakeLock을 걸고, 그래도 주머니에 넣으면 멈춘다고 화면에 적는다. */
var NAV={ on:false, watch:null, lock:null, steps:[], idx:0, last:'', route:[], mode:'car', off:0 };

function navSpeak(t){
  try{
    if(!window.speechSynthesis) return;
    var u=new SpeechSynthesisUtterance(t);
    u.lang='ko-KR'; u.rate=1.05;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(120); }catch(e){}
}
function navFmt(m){ return m>=1000 ? (m/1000).toFixed(1)+'km' : Math.round(m)+'m'; }
function navMeters(a,b){ return rtKm({lat:a[0],lng:a[1]},{lat:b[0],lng:b[1]})*1000; }
/* 경로선에서 가장 가까운 점까지 거리 — 길을 벗어났는지 보는 잣대 */
function navOffRoute(pos){
  var best=1e9;
  for(var i=0;i<NAV.route.length;i++){
    var d=navMeters(pos, NAV.route[i]);
    if(d<best) best=d;
  }
  return best;
}
function navButton(){
  var el=document.getElementById('rtNav');
  if(_rtMode==='transit'){ el.innerHTML=''; return; }   // 대중교통은 회전 안내가 없다
  el.innerHTML = NAV.on
    ? '<button class="rt-go stop" onclick="navStop()">■ 따라가기 멈춤</button>'
    : '<button class="rt-go" onclick="navStart()">▶ 따라가기 (음성 안내)</button>';
}
function navStart(){
  if(!NAV.steps.length){ alert('먼저 경로를 받아야 합니다.'); return; }
  if(!navigator.geolocation){ alert('이 브라우저는 위치 기능이 없습니다.'); return; }
  NAV.on=true; NAV.idx=0; NAV.last=''; NAV.mode=_rtMode; NAV.off=0;
  navButton();
  /* 화면이 꺼지면 위치추적이 멈춘다 → 켜 두기를 요청한다(되는 기기에서만) */
  try{
    if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(l){ NAV.lock=l; }).catch(function(){});
  }catch(e){}
  navSpeak('안내를 시작합니다');
  NAV.watch=navigator.geolocation.watchPosition(navTick, function(){}, 
    {enableHighAccuracy:true, timeout:15000, maximumAge:2000});
  navPaint('위치를 받는 중…', '', '');
}
function navStop(){
  NAV.on=false;
  if(NAV.watch!=null){ navigator.geolocation.clearWatch(NAV.watch); NAV.watch=null; }
  if(NAV.lock){ try{ NAV.lock.release(); }catch(e){} NAV.lock=null; }
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  navButton();
  var el=document.getElementById('rtLive'); if(el) el.remove();
}
function navPaint(다음, 남음, 경고){
  var el=document.getElementById('rtLive');
  if(!el){
    el=document.createElement('div'); el.className='rt-live'; el.id='rtLive';
    document.getElementById('rtNav').appendChild(el);
  }
  el.innerHTML='<div class="rt-next">'+esc(다음)+'</div>'
    + (남음? '<div class="rt-left">'+esc(남음)+'</div>':'')
    + (경고? '<div class="rt-off">'+esc(경고)+'</div>':'');
}
function navTick(pos){
  if(!NAV.on) return;
  var here=[pos.coords.latitude, pos.coords.longitude];
  _meLL={lat:here[0], lng:here[1]};
  // 길을 벗어났나 — 잇달아 세 번 멀면 다시 찾는다(GPS가 한 번씩 튀는 것에 흔들리지 않게)
  var 이탈=navOffRoute(here);
  var 한계=(NAV.mode==='car')?70:45;
  if(이탈>한계){
    NAV.off++;
    if(NAV.off>=3){
      NAV.off=0;
      navSpeak('경로를 다시 찾습니다');
      navPaint('경로를 다시 찾는 중…','','길에서 '+navFmt(이탈)+' 벗어났습니다');
      _rtFrom={lat:here[0], lng:here[1], 설명:'현재 위치'};
      rtRun();
      return;
    }
  } else { NAV.off=0; }

  // 다음 회전 지점 찾기 — 이미 지난 단계는 건너뛴다
  while(NAV.idx < NAV.steps.length-1
        && navMeters(here, NAV.steps[NAV.idx].at) < 25) NAV.idx++;
  var st=NAV.steps[NAV.idx];
  if(!st){ navPaint('도착했습니다','',''); navSpeak('도착했습니다'); navStop(); return; }
  var d=navMeters(here, st.at);
  var 남은거리=0;
  for(var i=NAV.idx;i<NAV.steps.length;i++) 남은거리+=NAV.steps[i].dist;
  navPaint(st.text + (st.name? ' · '+st.name : ''),
           navFmt(d)+' 앞 · 남은 거리 '+navFmt(남은거리),
           이탈>한계? '길에서 '+navFmt(이탈)+' 벗어남' : '');
  // 말은 한 번만 — 가까워졌을 때
  var 말거리=(NAV.mode==='car')?160:45;
  var key=NAV.idx+'@'+(d<말거리?'near':'far');
  if(d<말거리 && NAV.last!==key){
    NAV.last=key;
    navSpeak(navFmt(d)+' 앞 '+st.text+(st.name? ', '+st.name : ''));
  }
  if(NAV.idx>=NAV.steps.length-1 && d<30){
    navSpeak('목적지에 도착했습니다'); navPaint('도착했습니다','',''); navStop();
  }
}

function rtLinks(from, to, 직선){

/* 좌표 → 주소·장소명 (Nominatim 역검색, 무료·키 불필요). 이름칸을 미리 채워준다. */
function reverseFill(lat,lng){
  fetch('https://nominatim.openstreetmap.org/reverse?format=json&accept-language=ko&zoom=18&lat='+lat+'&lon='+lng)
    .then(function(r){ return r.json(); })
    .then(function(d){
      var nm=(d&&d.name)? d.name : '';
      var addr=(d&&d.display_name)? d.display_name.split(',').slice(0,4).join(',').trim() : '';
      paintLoc(nm||'선택한 위치', addr);
      var pn=document.getElementById('pName');
      if(pn && !pn.value.trim() && nm) pn.value=nm;
    })
    .catch(function(){ paintLoc('선택한 위치',''); });
}

function renderMyPlaces(){
  MYMARKERS.forEach(function(m){ map.removeLayer(m); }); MYMARKERS=[];
  if((window.COUNTRY||'kr')!=='my') return;   // 내 장소는 '내 지도' 탭에서만(전세계)
  if(!MY_ST.mine) return;                     // 「📌 내 장소」를 꺼두면 촬영지만 본다
  MYPLACES.concat(LIVEPLACES).forEach(function(p){
    if(MY_ST.cats[p.cat]===false) return;     // 카테고리 필터
    var cat=CATS[p.cat]||CATS.photo;
    var icon=L.divIcon({className:'', html:'<div class="mypin'+(p.live?' live':'')+'" style="background:'+cat.c+'"><b>'+cat.e+'</b></div>', iconSize:[26,26], iconAnchor:[13,26]});
    var m=L.marker([p.lat,p.lng],{icon:icon,zIndexOffset:1000}).addTo(map);
    m.bindPopup(pinPopupHTML(p), {minWidth:300, maxWidth:340, className:'pin-pop-wrap'});
    MYMARKERS.push(m);
  });
}
window.renderMyPlaces = renderMyPlaces;

/* ===== 핀 클릭 팝업: 네이버지도·구글맵·수정 3버튼 ===== */
function escJs(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/[\r\n]+/g,' '); }
function pinPopupHTML(p){
  var cat=CATS[p.cat]||CATS.photo;
  var h='<div class="pin-pop"><span class="pp-cat" style="background:'+cat.c+'">'+cat.e+' '+esc(cat.l)+'</span>';
  h+='<div class="pp-name">'+esc(p.name||'(무명)')+'</div>';
  if(p.memo) h+='<div class="pp-memo">'+esc(p.memo)+'</div>';
  h+='<div class="pp-btns">';
  var isKR=(p.lat>=33 && p.lat<=38.8 && p.lng>=124.5 && p.lng<=130.0);   // 한국 본토·제주 범위(해외는 네이버 제외)
  if(isKR) h+='<button class="pp-nv" onclick="openNaver('+p.lat+','+p.lng+',\''+escJs(p.name)+'\')">네이버지도에서 열기</button>';
  h+='<button class="pp-gg" onclick="openGoogle('+p.lat+','+p.lng+',\''+escJs(p.name)+'\')">구글맵에서 열기</button>';
  h+='<button class="pp-rt" onclick="ppRoute('+p.lat+','+p.lng+',\''+escJs(p.name||'내 장소')+'\')">🧭 여기로 가기 (길찾기)</button>';
  h+='<a class="sb-gev" href="'+gevHref(p.lat,p.lng,1200)+'" target="_blank" rel="noopener">🌍 3D 지구본으로 보기</a>';
  if(!p.live && p.id) h+='<button class="pp-ed" onclick="editPin(\''+p.id+'\')">✏️ 수정</button>';
  else if(p.live && p.mid) h+='<button class="pp-ed" onclick="openMyMapsEdit(\''+escJs(p.mid)+'\')">🗺️ My Maps에서 수정</button>';
  h+='</div></div>';
  return h;
}
function openNaver(lat,lng,name){
  var q=(name && name!=='(무명)' && name!=='(이름없음)') ? name : (lat+','+lng);
  window.open('https://map.naver.com/p/search/'+encodeURIComponent(q),'_blank');
}
function openGoogle(lat,lng,name){
  if(name && name!=='(무명)' && name!=='(이름없음)')
    window.open('https://www.google.com/maps/search/'+encodeURIComponent(name)+'/@'+lat+','+lng+',16z','_blank');
  else
    window.open('https://www.google.com/maps/search/?api=1&query='+lat+','+lng,'_blank');
}
function editPin(id){ var p=MYPLACES.filter(function(x){return x.id===id;})[0]; if(p){ map.closePopup(); openPModal(p); } }
function openMyMapsEdit(mid){ window.open('https://www.google.com/maps/d/edit?mid='+encodeURIComponent(mid),'_blank'); }
function openStreetView(lat,lng){ window.open('https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+lat+','+lng,'_blank'); }

/* ===== 구글 My Maps 자동연동 (프록시·토큰 없이 브라우저에서 직접 KML 읽기) ===== */
function saveMM(){ try{ localStorage.setItem('maydly_travel_mymaps', JSON.stringify(MYMAPS)); }catch(e){} }
function extractMid(s){ s=(s||'').trim(); var m=s.match(/[?&]mid=([^&\s]+)/); if(m) return decodeURIComponent(m[1]); m=s.match(/[A-Za-z0-9_\-]{18,}/); return m? m[0] : s; }
function kmlUrl(mid){ return 'https://www.google.com/maps/d/kml?mid='+encodeURIComponent(mid)+'&forcekml=1'; }
function parseKML(txt, mm){
  var d=new DOMParser().parseFromString(txt,'text/xml');
  var pms=d.getElementsByTagName('Placemark'); var n=0;
  for(var i=0;i<pms.length;i++){
    var p=pms[i];
    if(!p.getElementsByTagName('Point').length) continue;   // 핀(Point)만 — 경로·영역 제외
    var co=p.getElementsByTagName('coordinates')[0]; if(!co) continue;
    var parts=(co.textContent||'').trim().split(',');
    var lng=parseFloat(parts[0]), lat=parseFloat(parts[1]);
    if(isNaN(lat)||isNaN(lng)) continue;
    var nm=((p.getElementsByTagName('name')[0]||{}).textContent||'(무명)').trim();
    var dsc=(p.getElementsByTagName('description')[0]||{}).textContent||'';
    var tmp=document.createElement('div'); tmp.innerHTML=dsc; dsc=(tmp.textContent||'').trim();
    var cat=mm.cat||'photo';
    var EMO={'🍚':'rice','☕':'cafe','🍷':'drink','👀':'see','🎯':'todo','🛍️':'shop','📸':'photo','🎬':'studio','🏨':'stay'};   // 이름 앞 이모지로 카테고리 자동 인식
    for(var e in EMO){ if(nm.indexOf(e)===0){ cat=EMO[e]; nm=nm.slice(e.length).trim(); break; } }
    LIVEPLACES.push({ name:nm, lat:lat, lng:lng, memo:dsc, cat:cat, mid:mm.mid, source:'mymaps:'+(mm.label||''), live:true });
    n++;
  }
  return n;
}
function loadMyMaps(cb){
  LIVEPLACES=[];
  if(!MYMAPS.length){ if(cb)cb(0); return; }
  var done=0, total=0;
  MYMAPS.forEach(function(mm){
    fetch(kmlUrl(mm.mid)).then(function(r){ return r.text(); })
      .then(function(t){ total+=parseKML(t,mm); })
      .catch(function(e){ console.warn('My Maps 로드 실패', mm.mid, e); })
      .then(function(){ done++; if(done===MYMAPS.length){ if(cb)cb(total); } });
  });
}
function addMyMap(){
  var raw=document.getElementById('syncUrl').value; var mid=extractMid(raw);
  if(!mid || mid.length<15){ alert('구글 My Maps 공유링크를 넣어주세요'); return; }
  if(MYMAPS.some(function(x){return x.mid===mid;})){ alert('이미 연동된 지도예요'); return; }
  var cat=document.getElementById('syncCat').value;
  var label=(CATS[cat]||{}).l||'지도';
  var btn=document.querySelector('.sync-add-btn'); btn.textContent='연동 중…'; btn.disabled=true;
  fetch(kmlUrl(mid)).then(function(r){ if(!r.ok) throw 0; return r.text(); })
    .then(function(t){
      var d=new DOMParser().parseFromString(t,'text/xml');
      var cnt=d.getElementsByTagName('Point').length;
      if(!cnt){ alert('이 지도에서 저장된 핀을 찾지 못했어요.\n\nMy Maps가 "링크가 있는 모든 사용자 보기"로 공유됐는지, 지도에 핀이 있는지 확인해주세요.'); return; }
      MYMAPS.push({mid:mid,label:label,cat:cat}); saveMM();
      document.getElementById('syncUrl').value='';
      renderSyncList();
      loadMyMaps(function(){ renderMyPlaces(); fitMyPlaces(); });
      alert('연동 완료! 이 지도에서 '+cnt+'곳을 불러왔어요.\n앞으로 My Maps에 저장하면 앱 열 때마다 자동 반영됩니다.');
    })
    .catch(function(){ alert('이 링크를 불러올 수 없어요. My Maps 공유 설정("링크가 있는 모든 사용자")을 확인해주세요.'); })
    .then(function(){ btn.textContent='+ 연동'; btn.disabled=false; });
}
function removeMyMap(mid){
  if(!confirm('이 지도 연동을 해제할까요? (My Maps 원본은 그대로예요)')) return;
  MYMAPS=MYMAPS.filter(function(x){return x.mid!==mid;}); saveMM();
  renderSyncList(); loadMyMaps(function(){ renderMyPlaces(); fitMyPlaces(); });
}
function renderSyncList(){
  var el=document.getElementById('syncList');
  if(!MYMAPS.length){ el.innerHTML='<div class="plempty" style="padding:14px 0">아직 연동된 지도가 없어요.<br>아래에 구글 My Maps 공유링크를 넣어보세요.</div>'; return; }
  el.innerHTML=MYMAPS.map(function(mm){ var cat=CATS[mm.cat]||CATS.photo;
    return '<div class="syncitem"><div style="font-size:18px">'+cat.e+'</div><div class="si-in"><div class="si-nm">'+esc(mm.label)+' 지도</div><div class="si-sub">'+esc(mm.mid.slice(0,16))+'…</div></div><button class="si-del" onclick="removeMyMap(\''+esc(mm.mid)+'\')">해제</button></div>';
  }).join('');
}
function openSync(){ renderSyncList(); document.getElementById('sync').classList.add('on'); }
function closeSync(){ document.getElementById('sync').classList.remove('on'); }

/* 가져오기: 네이버·구글 등에서 뽑은 장소 JSON 파일 병합 (좌표 중복 제외) */
function importPlaces(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=function(){ var f=inp.files&&inp.files[0]; if(!f) return;
    var r=new FileReader(); r.onload=function(){ try{ mergePlaces(JSON.parse(r.result)); }catch(e){ alert('파일을 읽을 수 없어요. JSON 형식인지 확인해주세요.'); } };
    r.readAsText(f); };
  inp.click();
}
function mergePlaces(arr){
  if(!Array.isArray(arr)){ alert('형식이 올바르지 않아요 (배열이 아님)'); return; }
  var seen={}; MYPLACES.forEach(function(p){ seen[(+p.lat).toFixed(5)+','+(+p.lng).toFixed(5)]=1; });
  var added=0, dup=0;
  arr.forEach(function(p){
    if(p==null||p.lat==null||p.lng==null) return;
    var key=(+p.lat).toFixed(5)+','+(+p.lng).toFixed(5);
    if(seen[key]){ dup++; return; }
    MYPLACES.push({ id:'p'+Date.now()+Math.floor(Math.random()*1e6), name:p.name||'(이름없음)', lat:+p.lat, lng:+p.lng, cat:(CATS[p.cat]?p.cat:'photo'), memo:p.memo||'', country:p.country||'my', source:p.source||'import', ts:Date.now() });
    seen[key]=1; added++;
  });
  saveMP();
  if((window.COUNTRY||'')!=='my'){ renderCountry('my'); } else { renderMyPlaces(); fitMyPlaces(); }
  alert(added+'곳을 가져왔어요!'+(dup?' (중복 좌표 '+dup+'곳 제외)':''));
}
function openPList(){
  var el=document.getElementById('plitems');
  var list=MYPLACES.slice().sort(function(a,b){ return b.ts-a.ts; });
  var head=document.querySelector('#plist h3 span'); if(head) head.textContent='📑 내 장소 ('+list.length+')';
  if(!list.length){ el.innerHTML='<div class="plempty">아직 저장한 장소가 없어요.<br><b>📥 가져오기</b>로 네이버·구글 장소를 넣거나<br><b>➕ 장소 추가</b>로 지도를 눌러 저장하세요.</div>'; }
  else { el.innerHTML=list.map(function(p){ var cat=CATS[p.cat]||CATS.photo;
    return '<div class="plitem"><div class="pe">'+cat.e+'</div><div class="pin"><div class="pnm">'+esc(p.name)+' <span style="font-size:11px;color:#aaa;font-weight:500">'+cat.l+'</span></div>'+(p.memo?'<div class="pmemo">'+esc(p.memo)+'</div>':'')+'</div><button class="pdel" onclick="delPlace(\''+p.id+'\')">삭제</button></div>';
  }).join(''); }
  document.getElementById('plist').classList.add('on');
}
function closePList(){ document.getElementById('plist').classList.remove('on'); }
function delPlace(id){ if(!confirm('이 장소를 삭제할까요?')) return; MYPLACES=MYPLACES.filter(function(p){ return p.id!==id; }); saveMP(); renderMyPlaces(); openPList(); }
renderMyPlaces();
</script>
